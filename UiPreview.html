<script>
/* 右側のプレビュー（押したときだけ作る） */

const GENERAL_IMAGE_LIMIT = 10;

function folderImageWarning(total, limit, label) {
  if (!(total > limit)) return '';
  return html`<div class="warning-note">${label}は${limit}枚まで表示します（${total}枚中${limit}枚を使用）。</div>`;
}

function buildThumbCarouselHtml(images, poster=false) {
  const source = (images || []).slice(0, 10);
  if (!source.length) return '';
  if (poster) {
    return html`
      <div class="preview-carousel poster is-poster-carousel">
        <div class="preview-thumb">${mediaImageHtml(source[0])}</div>
        ${source.length > 1 && html`<div class="preview-poster-dots">${source.slice(0, 2).map((_, index) => html`<span class="${index === 0 ? 'is-active' : ''}"></span>`)}</div>`}
      </div>`;
  }
  const visible = source.slice(0, 4);
  const extra = Math.max(0, source.length - visible.length);
  return html`<div class="preview-carousel count-${Math.min(source.length, 4)}">${visible.map((img, index) => html`
    <div class="preview-thumb">
      ${mediaImageHtml(img)}
      ${extra > 0 && index === visible.length - 1 && html`<span class="preview-more">+${extra}</span>`}
    </div>`)}</div>`;
}

/* 公開サイトの記事カードに合わせる：写真があり、ペインが広ければ「文章は左、写真は右」の2列 */
function buildArticlePreviewHtml(kicker, metaText, title, body, images, warningHtml) {
  const imagesHtml = buildThumbCarouselHtml(images);
  return html`
    <article class="preview-site-card preview-article${imagesHtml && html` has-images`}">
      <div class="preview-article-text">
        <div class="preview-inline-meta"><span>${kicker}</span><span>${metaText}</span></div>
        <h4>${title}</h4>
        <p>${renderRichText(body)}</p>
      </div>
      ${imagesHtml && html`<div class="preview-article-images">${imagesHtml}</div>`}
      ${warningHtml}
    </article>`;
}

/* 公開サイトの展示会カードに合わせる：見出しは本文の列に置き、DM を横に並べる。ペインが狭いとき（サイトのスマホ表示に
   あたる）は見出し→DM→本文の順にするため、見出しを2か所に出して CSS で切り替える */
function buildExhibitionPreviewCardHtml(item, kicker, dm, linkHtml = '', extraHtml = '') {
  const heading = (placement) => html`
    <div class="preview-exhibition-heading is-${placement}">
      <span class="preview-site-kicker">${kicker}</span>
      ${item.subtitle && html`<div class="preview-exhibition-subtitle">${item.subtitle}</div>`}
      <h4>${item.title || '展示会名'}</h4>
    </div>`;
  const overview = item.theme || item.overview || '';
  return html`
    <article class="preview-site-card">
      ${heading('narrow')}
      <div class="preview-exhibition-layout${!dm.length && html` no-poster`}">
        <div class="preview-exhibition-copy">
          ${heading('wide')}
          ${overview && html`<p class="preview-exhibition-overview">${renderRichText(overview)}</p>`}
          ${linkHtml}
          <div class="preview-exhibition-meta">${buildMetaListHtml(item)}</div>
        </div>
        ${dm.length > 0 && html`<div class="preview-dm-slot">${buildThumbCarouselHtml(dm, true)}</div>`}
      </div>
      ${extraHtml}
    </article>`;
}

/* 出展作品：公開サイトと同じ並べ方（行の中で高さをそろえ、幅は縦横比に合わせる）で小さめに並べる。
   縦横比は画像を読み込んでから分かるので、onload で --ratio を入れる。
   確かめるときのスクロールを減らすため、最初の12点のほかは「すべて表示」で開く */
const PREVIEW_WORKS_VISIBLE = 12;

function buildWorkGalleryPreviewHtml(works) {
  if (!works.length) return '';
  const hidden = works.length - PREVIEW_WORKS_VISIBLE;
  return html`
    <div class="preview-work-label">出展作品<span>${works.length}点</span></div>
    <div class="preview-work-grid${hidden > 0 && html` is-collapsed`}">${works.map((work) => html`
      <div class="preview-work-card">
        ${mediaImageHtml(work.file, html` onload="this.parentElement.style.setProperty('--ratio', Math.min(Math.max(this.naturalWidth / this.naturalHeight, 0.4), 3).toFixed(3))"`)}
        <div class="preview-work-title">${work.title}</div>
        <div class="preview-work-artist">${work.artist}</div>
      </div>`)}</div>
    ${hidden > 0 && html`<button class="preview-work-more" type="button" onclick="this.previousElementSibling.classList.remove('is-collapsed'); this.remove()">すべての作品を表示(残り${hidden}点)</button>`}`;
}

/* 新歓カレンダーは全部の画像を横に並べ、スクロールして確かめる。
   枠の縦横比は、公開サイトのスマホ表示と同じく、いちばん縦長の画像に合わせる（16:9〜4:5） */
function buildRecruitPreviewHtml(images) {
  const source = (images || []).slice(0, GENERAL_IMAGE_LIMIT);
  if (!source.length) return '';
  return html`
    <div class="preview-recruit-carousel">
      <div class="preview-recruit-track">${source.map((image) => html`<div class="preview-recruit-slide">${mediaImageHtml(image, html` onload="fitRecruitPreviewFrame(this)"`)}</div>`)}</div>
      ${source.length > 1 && html`
        <button class="preview-recruit-step is-prev" type="button" aria-label="前の画像" onclick="stepRecruitPreview(this, -1)">‹</button>
        <button class="preview-recruit-step is-next" type="button" aria-label="次の画像" onclick="stepRecruitPreview(this, 1)">›</button>
        <div class="preview-recruit-count">全${source.length}枚</div>`}
    </div>`;
}

function stepRecruitPreview(button, delta) {
  const track = button.parentElement.querySelector('.preview-recruit-track');
  if (track) track.scrollBy({ left: delta * track.clientWidth, behavior: 'smooth' });
}

function fitRecruitPreviewFrame(img) {
  const frame = img.closest('.preview-recruit-carousel');
  if (!frame || !img.naturalWidth) return;
  const ratio = Math.min(16 / 9, Math.max(0.8, img.naturalWidth / img.naturalHeight));
  const current = Number(frame.getAttribute('data-ratio') || 99);
  if (ratio >= current) return;
  frame.setAttribute('data-ratio', String(ratio));
  frame.style.aspectRatio = String(ratio);
}

function buildMetaListHtml(item) {
  const metaRow = (label, value) => html`<div class="preview-meta-row"><div class="preview-meta-label">${label}</div><div class="preview-meta-value">${value}</div></div>`;
  const mapQuery = [item.venueName, item.venueAddress].filter(Boolean).join(' ');
  const rows = [];
  if (item.dateLine || item.timeLine) {
    rows.push(metaRow('会期', html`
      ${item.dateLine && html`<span>${item.dateLine}</span>`}
      ${item.timeLine && html`<span class="address">${item.timeLine}</span>`}`));
  }
  if (item.venueName || item.venueAddress) {
    rows.push(metaRow('会場', html`
      ${item.venueName}
      ${item.venueAddress && html`
        <a class="address preview-map-link" href="${googleMapsSearchUrl(mapQuery)}" target="_blank" rel="noopener noreferrer" aria-label="${item.venueAddress}（Google マップで開く）">
          <i class="fa-solid fa-location-dot" aria-hidden="true"></i><span>${item.venueAddress}</span>
        </a>`}`));
  }
  return rows.length > 0 && html`<div class="preview-meta-list">${rows}</div>`;
}

/* ---------- 右側のプレビュー ----------
   ボタンを押したときだけ作る（画像の一覧もそのとき初めて取りに行く）。
   一度表示したら、ページを読み込み直すまで入力に合わせて作り直す（画像の一覧は覚えているのでサーバーには頼まない） */
function isPreviewOpen(kind) {
  return !!appState.previewOpen[kind];
}

function previewPlaceholderHtml(kind) {
  return html`<div class="preview-placeholder"><button class="button subtle" type="button" onclick="openPreview('${jsString(kind)}')">プレビューを表示</button></div>`;
}

/* 閉じているときはボタンを出して false を返す */
function ensurePreviewOpen(kind, element) {
  if (isPreviewOpen(kind)) return true;
  if (element && !element.querySelector('.preview-placeholder')) element.innerHTML = previewPlaceholderHtml(kind);
  return false;
}

function openPreview(kind) {
  appState.previewOpen[kind] = true;
  if (kind === 'logs') renderLogsPreviewContent();
  else refreshPreview(kind);
}

async function showPreviewHtml(element, content) {
  if (!element) return;
  element.innerHTML = content;
  hydrateThumbnails(element);
}

/* タブごとのプレビューを作る関数。表示する場所は id が「種類 + Preview」の要素 */
const PREVIEW_RENDERERS = {
  recruit: (items) => renderRecruitPreview(items),
  activity: (items) => renderActivityPreview(items),
  exhibition: (items) => renderExhibitionPreview(items),
  request: (items) => renderRequestPreview(items)
};

async function refreshPreview(kind) {
  const render = PREVIEW_RENDERERS[kind];
  const preview = render ? document.getElementById(kind + 'Preview') : null;
  if (!preview || !ensurePreviewOpen(kind, preview)) return;
  try {
    showPreviewHtml(preview, await render(buildPayloadList(kind)));
  } catch (error) {
    preview.innerHTML = html`<div class="preview-empty">${error.message || String(error)}</div>`;
  }
}

async function renderRecruitPreview(items) {
  const recruit = items.find((item) => item.published !== false) || items[0] || {};
  if (!recruit.mediaFolderId) return html`<div class="preview-empty">画像は未設定です。</div>`;
  const files = await getFolderImagesCached(recruit.mediaFolderId);
  const registered = orderedFilesByIds(files, mediaIdsForItem(recruit));
  return html`
    <div class="preview-site">
      <article class="preview-site-card">
        <span class="preview-site-kicker">WELCOME CALENDAR</span>
        <h4>${recruitCalendarLabel(recruit.year)}</h4>
        ${buildRecruitPreviewHtml(registered.slice(0, GENERAL_IMAGE_LIMIT))}
        ${folderImageWarning(registered.length, GENERAL_IMAGE_LIMIT, '画像')}
      </article>
    </div>`;
}

/* 記事のプレビュー（活動記録・告知と取り組み事例）：登録した画像を GENERAL_IMAGE_LIMIT 枚まで出す */
async function buildArticleItemPreviewHtml(item, kicker, metaText) {
  const folderId = item.mediaFolderId || '';
  const files = folderId ? await getFolderImagesCached(folderId) : [];
  const registered = folderId ? orderedFilesByIds(files, mediaIdsForItem(item)) : [];
  return buildArticlePreviewHtml(
    kicker, metaText,
    item.title || 'タイトル未入力', item.body || '本文未入力',
    registered.slice(0, GENERAL_IMAGE_LIMIT), folderImageWarning(registered.length, GENERAL_IMAGE_LIMIT, '画像'));
}

async function renderActivityPreview(items) {
  const visible = (items || []).filter((item) => item.published !== false).slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  if (!visible.length) return html`<div class="preview-empty">公開中の記事はありません。</div>`;
  const cards = await Promise.all(visible.map((item) => buildArticleItemPreviewHtml(item, activityCategoryLabel(item.category), formatDate(item.createdAt))));
  return html`<div class="preview-site">${cards}</div>`;
}

async function renderExhibitionPreview(items) {
  const visible = sortExhibitions((items || []).filter((item) => item.published !== false));
  const upcoming = visible.filter((item) => item.displayBucket === 'upcoming');
  const archive = visible.filter((item) => item.displayBucket === 'archive');
  const recent = archive.length ? archive[0] : null;
  const archiveRest = archive.slice(1);
  const dmOf = (item, images) => normalizeIdList(item.dmFileIds).map((id) => fileById(images, id)).filter(Boolean);

  const upcomingCards = await Promise.all(upcoming.map(async (item, idx) => {
    const images = await getFolderImagesCached(item.mediaFolderId);
    return buildExhibitionPreviewCardHtml(item, idx === 0 ? 'NEXT EXHIBITION' : 'UPCOMING', dmOf(item, images));
  }));

  let recentCard = '';
  if (recent) {
    const images = await getFolderImagesCached(recent.mediaFolderId);
    const workImages = (recent.works || []).map((work) => {
      const found = fileById(images, work.fileId);
      return found ? { file: found, title: work.title, artist: work.artist } : null;
    }).filter(Boolean);
    recentCard = buildExhibitionPreviewCardHtml(recent, 'RECENT EXHIBITION', dmOf(recent, images), '', buildWorkGalleryPreviewHtml(workImages));
  }

  const archiveCards = await Promise.all(archiveRest.map(async (item) => {
    const images = await getFolderImagesCached(item.mediaFolderId);
    const link = item.mediaFolderId && html`<a class="preview-drive-link" href="${driveFolderUrl(item.mediaFolderId)}" target="_blank" rel="noopener noreferrer">Google Driveで作品を観る ↗</a>`;
    return buildExhibitionPreviewCardHtml(item, 'ARCHIVE', dmOf(item, images), link);
  }));

  return html`
    <div class="preview-site">
      ${upcomingCards}
      ${recentCard}
      ${archiveCards.length
        ? archiveCards
        : html`<article class="preview-site-card"><div class="preview-empty">公開中のアーカイブはありません。</div></article>`}
    </div>`;
}

async function renderRequestPreview(items) {
  const visible = (items || []).filter((item) => item.published !== false);
  if (!visible.length) return html`<div class="preview-empty">公開中の事例はありません。</div>`;
  const cards = await Promise.all(visible.map((item, index) => buildArticleItemPreviewHtml(item, '過去の取り組み事例', `表示順 ${index + 1}`)));
  return html`<div class="preview-site">${cards}</div>`;
}

let logsPreviewTimer = 0;

let logsPreviewRequestSeq = 0;

function scheduleLogsPreviewRefresh() {
  if (!isPreviewOpen('logs')) return;
  if (logsPreviewTimer) clearTimeout(logsPreviewTimer);
  logsPreviewTimer = setTimeout(() => {
    logsPreviewTimer = 0;
    renderLogsPreviewContent();
  }, 350);
}

const LOGS_PREVIEW_BADGES = { added: '追加', removed: '非表示' };

function buildLogsPreviewCardHtml(compared, noteHtml, isLoading, closed = false) {
  const items = compared || [];
  if (closed) {
    return html`
      <div class="card">
        <h2>サイトの更新履歴プレビュー</h2>
        ${previewPlaceholderHtml('logs')}
      </div>`;
  }
  return html`
    <div class="card">
      <div data-help>
        <div class="help-title"><h2>サイトの更新履歴プレビュー</h2>${HELP_BUTTON}</div>
        <p class="panel-lead help-text">緑は今回の公開で新しく表示される項目、赤は今回の公開でサイト上から非表示になる項目です。</p>
      </div>
      <div class="preview-sim-legend">
        <span class="preview-sim-chip is-added">追加・再表示</span>
        <span class="preview-sim-chip is-removed">非表示</span>
        <span class="preview-sim-chip is-unchanged">継続表示</span>
      </div>
      ${noteHtml}
      <div class="preview-sim-list">
        ${items.length
          ? items.map((entry) => html`
            <div class="preview-sim-item">
              <div class="preview-sim-date">${entry.date}</div>
              <ul class="preview-sim-bullets">${entry.items.map((item) => html`
                <li class="is-${item.status}">
                  <span class="preview-sim-badge is-${item.status}">${LOGS_PREVIEW_BADGES[item.status] || '継続'}</span>
                  <span class="preview-sim-text">${item.summary}</span>
                </li>`)}</ul>
            </div>`)
          : !isLoading && html`<div class="small-note">まだ履歴がありません。</div>`}
      </div>
    </div>`;
}

async function renderLogsPreviewContent() {
  const wrap = document.getElementById('logsPreviewContent');
  if (!wrap) return;
  if (!isPreviewOpen('logs')) {
    wrap.innerHTML = buildLogsPreviewCardHtml([], '', false, true);
    return;
  }
  const requestSeq = ++logsPreviewRequestSeq;
  wrap.innerHTML = buildLogsPreviewCardHtml([], html`<div class="small-note" style="margin-bottom:12px;">公開後の履歴を確認しています...</div>`, true);
  try {
    const data = await serverCall('previewSiteHistory', appState.sessionToken, buildPayload());
    if (requestSeq !== logsPreviewRequestSeq || !document.getElementById('logsPreviewContent')) return;
    wrap.innerHTML = buildLogsPreviewCardHtml((data && data.compared) || []);
  } catch (error) {
    if (requestSeq !== logsPreviewRequestSeq || !document.getElementById('logsPreviewContent')) return;
    wrap.innerHTML = buildLogsPreviewCardHtml([], html`<div class="small-note error-text" style="margin-bottom:12px;">更新履歴プレビューを取得できませんでした: ${error.message || error}</div>`);
  }
}
</script>
