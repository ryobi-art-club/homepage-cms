
<style>
/* ==========================================================================
   凌美会 管理画面 スタイル
   rev13〜rev30の積層オーバーライドを最終計算結果に統合したフラット版。
   未使用セレクタ(旧work-editor系・thumb-strip系など)は削除済み。
   構成: トークン / ベース / シェル(サイドバー・トップバー) / ボタン /
         カード・KPI / フォーム / ステータス履歴 / ログ / 認証 /
         プレビュー / ストレージ / メディアモーダル / カタログ / メディアクエリ
   ========================================================================== */
:root {
  --bg: #0a0a0a;
  --card: rgba(255,255,255,0.06);
  --card-2: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.10);
  --text: #ffffff;
  --soft: rgba(255,255,255,0.76);
  --muted: rgba(255,255,255,0.56);
  --yellow: #f6d926;
  --blue: #213694;
  --green: #88c484;
  --danger: #f36c6c;
  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 14px;
  --shadow: 0 18px 50px rgba(0,0,0,0.28);
}

/* ---------- ベース ---------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Noto Sans JP', sans-serif;
  background:
    radial-gradient(circle at top left, rgba(136,196,132,0.12), transparent 28%),
    radial-gradient(circle at bottom right, rgba(33,54,148,0.16), transparent 34%),
    var(--bg);
  color: var(--text);
}
button, input, textarea, select { font: inherit; }
select { color-scheme: dark; }
select option { background: #101010; color: #ffffff; }
a { color: inherit; }
body.media-modal-open { overflow: hidden; }
.hidden { display: none !important; }

/* ---------- アプリシェル ---------- */
.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 280px 1fr;
}
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  border-right: 1px solid rgba(255,255,255,0.08);
  background: rgba(10,10,10,0.82);
  backdrop-filter: blur(16px);
  padding: 24px 18px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
}
.brand-badge {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(246,217,38,0.25), rgba(33,54,148,0.28));
  display: grid;
  place-items: center;
  font-weight: 900;
  letter-spacing: 0.12em;
  color: var(--text);
}
.brand-badge i { font-size: 1.22rem; }
.brand-copy strong {
  display: block;
  font-size: 1rem;
}
.brand-copy span {
  color: var(--muted);
  font-size: 0.84rem;
}
.sidebar-nav {
  display: grid;
  gap: 10px;
}
.nav-button {
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: rgba(255,255,255,0.04);
  color: var(--soft);
  border-radius: 16px;
  padding: 14px 16px;
  cursor: pointer;
  transition: 0.2s ease;
}
.nav-button:hover,
.nav-button.is-active {
  background: rgba(33,54,148,0.24);
  color: var(--text);
  border-color: rgba(246,217,38,0.26);
}
.sidebar-meta {
  margin-top: 24px;
  padding: 16px;
  border-radius: 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
}
.sidebar-meta p {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 0.82rem;
}
.content {
  padding: 24px 28px 96px;
  width: 100%;
  max-width: none;
  margin: 0;
  min-width: 0;
}

/* ---------- トップバー ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: space-between;
  align-items: center;
  margin: -24px -28px 22px;
  padding: 18px 28px 22px;
  width: auto;
  background: linear-gradient(180deg, rgba(10,10,10,0.94), rgba(10,10,10,0.66), rgba(10,10,10,0));
  backdrop-filter: blur(10px);
}
.topbar-title {
  flex: 1 1 420px;
  min-width: min(100%, 320px);
  position: relative;
}
.topbar-title h1 {
  margin: 0 0 6px;
  font-size: clamp(1.8rem, 3vw, 2.6rem);
}
.topbar-title p {
  margin: 0;
  color: var(--soft);
}
.topbar-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* ---------- ボタン ---------- */
.button {
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.05);
  color: var(--text);
  border-radius: 999px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: 700;
  transition: 0.2s ease;
}
.button:hover { transform: translateY(-1px); }
.media-modal .button:hover,
.media-modal .icon-action-button:hover {
  transform: none;
}
.button:disabled {
  opacity: .38;
  cursor: not-allowed;
  transform: none;
}
.button:disabled:hover { transform: none; }
.button.primary { background: var(--blue); }
.button.success { background: var(--green); color: #0a0a0a; }
.button.warning { background: var(--yellow); color: #0a0a0a; }
.button.danger { background: rgba(243,108,108,0.16); color: #ffd5d5; }
.button.icon { padding: 9px; line-height: 0; }
.button.ghost { background: transparent; }
.button.subtle { background: rgba(255,255,255,0.08); }
.button.hidden-toggle { background: rgba(255,255,255,0.08); }
.button.hidden-toggle.is-hidden { background: rgba(246,217,38,0.22); color: var(--text); }
.icon-action-button {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.06);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: 0 0 auto;
  position: static;
}
.icon-action-button:hover {
  background: rgba(255,255,255,0.12);
  transform: translateY(-1px);
}

/* ---------- パネル・カード・KPI ---------- */
.panel { display: none; }
.panel.is-active { display: block; }
.grid-2 {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 22px;
}
.card {
  background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 22px;
  box-shadow: var(--shadow);
}
.card h2, .card h3, .card h4 { margin: 0 0 14px; }
.card p.lead {
  margin: 0 0 14px;
  color: var(--soft);
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
.kpi {
  padding: 16px;
  border-radius: 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
}
.kpi-label {
  color: var(--muted);
  font-size: 0.8rem;
  margin-bottom: 6px;
}
.kpi-value {
  font-size: 1.4rem;
  font-weight: 800;
}

/* ---------- フォーム ---------- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 16px;
}
.field {
  display: grid;
  gap: 8px;
}
.field label {
  font-size: 0.86rem;
  color: var(--muted);
}
.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  background: rgba(255,255,255,0.05);
  color: var(--text);
  padding: 12px 14px;
}
.field input[type="date"] { color-scheme: dark; }
.field input[type="date"]::-webkit-calendar-picker-indicator {
  filter: brightness(0) invert(1) saturate(0) contrast(200%);
  opacity: 1;
}
.field textarea {
  min-height: 140px;
  resize: vertical;
}
.field.full { grid-column: 1 / -1; }
.field select,
select {
  appearance: none;
  -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.78) 50%),
    linear-gradient(135deg, rgba(255,255,255,0.78) 50%, transparent 50%);
  background-position:
    calc(100% - 30px) 50%,
    calc(100% - 23px) 50%;
  background-size: 7px 7px, 7px 7px;
  background-repeat: no-repeat;
  padding-right: 54px;
}
.field-icon-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.field-icon-wrap input {
  flex: 1 1 auto;
  min-width: 0;
  padding-right: 0;
}
.stack { display: grid; gap: 16px; }
.editor-list { display: grid; gap: 16px; }
.editor-item {
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  border-radius: 18px;
  padding: 16px;
}
.editor-item-head {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.editor-item-meta {
  color: var(--muted);
  font-size: 0.84rem;
}
.item-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.item-title-line {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.visibility-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  background: rgba(255,255,255,0.08);
  color: var(--soft);
  border: 1px solid rgba(255,255,255,0.08);
}
.visibility-chip.is-hidden {
  background: rgba(246,217,38,0.16);
  color: #fff3aa;
  border-color: rgba(246,217,38,0.22);
}
.draft-actions-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.small-note {
  color: var(--muted);
  font-size: 0.82rem;
}
.confirm-note {
  color: var(--muted);
  font-size: 0.82rem;
}
.warning-note {
  color: rgba(246,217,38,0.92);
  font-size: 0.84rem;
  margin-top: 10px;
}
.hr {
  border: 0;
  height: 1px;
  background: rgba(255,255,255,0.08);
  margin: 18px 0;
}

/* ---------- ステータス・履歴 ---------- */
.status-area {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: stretch;
}
.status-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  white-space: pre-line;
}
#statusMessage {
  width: 100%;
  align-items: flex-start;
}
.status-history-button {
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.05);
  color: var(--soft);
  border-radius: 16px;
  padding: 0 14px;
  min-width: 64px;
  cursor: pointer;
  font-weight: 800;
  transition: 0.2s ease;
}
.status-history-button:hover,
.status-history-button[aria-expanded="true"] {
  background: rgba(33,54,148,0.24);
  color: var(--text);
  border-color: rgba(246,217,38,0.24);
}
.status-history-panel {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  z-index: 160;
  width: min(520px, calc(100vw - 56px));
  max-height: min(420px, calc(100vh - 180px));
  overflow: hidden;
  border-radius: 18px;
  background: rgba(12,12,12,0.96);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 22px 70px rgba(0,0,0,0.45);
  backdrop-filter: blur(18px);
}
.status-history-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.status-history-list {
  display: grid;
  gap: 8px;
  max-height: 340px;
  overflow: auto;
  padding: 12px;
}
.status-history-list::-webkit-scrollbar { width: 10px; }
.status-history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 999px; }
.status-history-item {
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
}
.status-history-item.is-success {
  background: rgba(136,196,132,0.12);
  border-color: rgba(136,196,132,0.22);
}
.status-history-item.is-error {
  background: rgba(243,108,108,0.12);
  border-color: rgba(243,108,108,0.24);
}
.status-history-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 0.76rem;
}
.status-history-message {
  color: var(--soft);
  font-size: 0.86rem;
  white-space: pre-line;
}
.status-history-empty {
  padding: 18px;
  color: var(--muted);
  text-align: center;
}

/* ---------- 更新履歴ログ ---------- */
.log-list {
  display: grid;
  gap: 12px;
}
.log-item {
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
}
.log-date { color: var(--muted); font-size: 0.8rem; }
.log-list-scroll { max-height: 420px; overflow: auto; padding-right: 6px; }
.log-list-scroll::-webkit-scrollbar { width: 10px; }
.log-list-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 999px; }

/* ---------- 認証 ---------- */
.auth-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.auth-card {
  width: min(560px, 100%);
  padding: 28px;
  border-radius: 28px;
  background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.auth-card h1 { margin: 0 0 8px; }
.auth-card p { color: var(--soft); }
.auth-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}

/* ==========================================================================
   サイトプレビュー
   公開サイトの見た目をプレビューペイン内で再現する。
   ペインはコンテナクエリ(760px)でモバイル表示に切り替わる。
   ========================================================================== */
.preview-frame {
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
  background: rgba(255,255,255,0.03);
}
.preview-pane {
  padding: 18px;
  min-height: 240px;
  min-width: 0;
  container-type: inline-size;
}
.preview-pane img { max-width: 100%; }
.preview-site {
  display: grid;
  gap: 14px;
  min-width: 0;
}
.preview-site-card {
  display: grid;
  gap: 14px;
  padding: 16px;
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.08);
  min-width: 0;
  overflow: hidden;
}
.preview-site-card h4 {
  margin: 0 0 8px;
  font-size: 1.05rem;
}
.preview-site-card p {
  margin: 0;
  color: var(--soft);
  white-space: pre-wrap;
}
.preview-site-card a {
  color: var(--green);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.preview-site-kicker {
  display: inline-block;
  margin-bottom: 10px;
  color: var(--yellow);
  font-size: 0.76rem;
  letter-spacing: 0.18em;
  font-weight: 700;
}
.preview-exhibition-subtitle {
  margin: -2px 0 6px;
  color: var(--soft);
  font-size: 0.86rem;
  font-weight: 700;
}
.preview-inline-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 0.82rem;
  margin-bottom: 8px;
}
.preview-empty { color: var(--muted); }
.preview-drive-wrap {
  margin-top: 42px;
  text-align: center;
}

/* 展示会レイアウト(本文 + DMポスター) */
.preview-exhibition-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(160px, 220px);
  gap: 14px;
  align-items: start;
}
.preview-exhibition-copy { min-width: 0; }
/* p.〜 にして .preview-site-card p の margin:0 より優先させる */
p.preview-exhibition-overview { margin: 0 0 10px; }
.preview-dm-slot {
  display: flex;
  justify-content: flex-end;
  width: 100%;
}

/* 会期・会場メタ */
.preview-meta-list {
  display: grid;
  gap: 8px;
  margin-top: 14px;
}
.preview-meta-row {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 8px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.preview-meta-row:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}
.preview-meta-label {
  color: var(--muted);
  font-size: 0.78rem;
  white-space: nowrap;
}
.preview-meta-value { color: var(--text); }
.preview-meta-value .address {
  display: block;
  color: var(--soft);
  margin-top: 4px;
}

/* 画像カルーセル(X風コラージュ: 枚数別) */
.preview-carousel {
  display: grid;
  margin-top: 14px;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  background: transparent;
}
.preview-thumb {
  position: relative;
  min-width: 0;
  overflow: hidden;
}
.preview-more {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(0,0,0,0.48);
  color: white;
  font-size: 1.65rem;
  font-weight: 800;
}
.preview-carousel.count-1 {
  display: block;
  grid-template-columns: 1fr;
  max-width: none;
  aspect-ratio: auto;
  overflow: visible;
  border-radius: 0;
  padding: 0;
  gap: 0;
  align-items: center;
  justify-content: center;
  justify-items: center;
}
.preview-carousel.count-1 .preview-thumb {
  display: block;
  width: 100%;
  height: auto;
  min-height: 0;
  max-width: 100%;
  background: transparent;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
}
@container (min-width: 761px) {
  .preview-carousel.count-1 .preview-thumb { place-items: center; }
}
.preview-carousel.count-1 .preview-thumb img {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  object-fit: contain;
  border-radius: 16px;
}
.preview-carousel.count-2,
.preview-carousel.count-3,
.preview-carousel.count-4 {
  aspect-ratio: 16 / 9;
  gap: 4px;
  overflow: hidden;
  border-radius: 16px;
}
.preview-carousel.count-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: 1fr;
}
.preview-carousel.count-3 {
  grid-template-columns: 1.55fr 1fr;
  grid-template-rows: repeat(2, minmax(0, 1fr));
}
.preview-carousel.count-2 .preview-thumb { grid-row: 1 / span 2; }
.preview-carousel.count-3 .preview-thumb:first-child { grid-column: 1 / 2; grid-row: 1 / 3; }
.preview-carousel.count-4 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}
.preview-carousel.count-2 .preview-thumb,
.preview-carousel.count-3 .preview-thumb,
.preview-carousel.count-4 .preview-thumb {
  width: 100%;
  height: 100%;
  min-height: 0;
  border-radius: 0;
  background: transparent;
  overflow: hidden;
}
.preview-carousel.count-2 .preview-thumb img,
.preview-carousel.count-3 .preview-thumb img,
.preview-carousel.count-4 .preview-thumb img {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 0;
}

/* DMポスターカルーセル(100:148カード + ドット) */
.preview-carousel.poster.is-poster-carousel {
  width: 100%;
  max-width: 100%;
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  justify-items: center;
  justify-content: stretch;
  justify-self: center;
  background: transparent;
  border: 0;
  border-radius: 12px;
  overflow: hidden;
  padding: 0;
  margin: 0 auto;
}
.preview-carousel.poster.is-poster-carousel .preview-thumb {
  width: min(100%, 260px);
  max-width: 100%;
  aspect-ratio: 100 / 148;
  object-fit: cover;
  overflow: hidden;
  border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
}
.preview-carousel.poster.is-poster-carousel .preview-thumb img {
  width: 100%;
  height: 100%;
  aspect-ratio: 100 / 148;
  object-fit: cover;
  display: block;
  border-radius: 0;
  background: rgba(255,255,255,0.03);
}
.preview-poster-dots {
  display: flex;
