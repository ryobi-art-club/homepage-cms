<script>
const appState = {
  sessionToken: '',
  viewerEmail: '',
  viewerName: '',
  previewUrl: '',
  drafts: [],
  adminLog: [],
  maintenance: { storage: null, recommendations: [] },
  state: {
    recruitCalendars: [],
    activityArticles: [],
    exhibitions: [],
    requestCases: [],
    changeLog: [],
    manualChangeNote: ''
  },
  imageCache: {},
  mediaCache: {},
  thumbnailCache: {},
  previewOpen: {},
  catalogDrafts: {},
  statusHistory: [],
  dirty: false,
  suppressDirty: false
};

const STATUS_MIN_VISIBLE_MS = 1000;
const STATUS_HISTORY_LIMIT = 30;
const statusRuntime = {
  queue: [],
  processing: false,
  token: 0
};

document.addEventListener('DOMContentLoaded', () => {
  bindGlobalEvents();
  resumeSession();
});

/* ログインはこのタブだけに覚えておき（sessionStorage）、再読み込みしても有効期限（サーバーの
   SESSION_TTL_MINUTES）の間は確認コードなしで続ける。タブを閉じると消える。
   ブラウザが保存を許さないときは、これまでどおり毎回ログインする */
const SESSION_STORAGE_KEY = 'ryobiCmsSession';

function rememberSession() {
  try {
    sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
      token: appState.sessionToken,
      name: appState.viewerName,
      email: appState.viewerEmail
    }));
  } catch (error) { /* 保存できなくても、ログインはできる */ }
}

function forgetSession() {
  try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (error) { /* 同上 */ }
}

function showAppShell() {
  document.getElementById('authShell').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
}

async function resumeSession() {
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(SESSION_STORAGE_KEY) || 'null'); } catch (error) { saved = null; }
  if (!saved || !saved.token) return;
  appState.sessionToken = saved.token;
  appState.viewerName = saved.name || saved.email || '';
  appState.viewerEmail = saved.email || '';
  /* 読み込みの間は、メールアドレスの欄と確認コードのボタンを隠す */
  const authShell = document.getElementById('authShell');
  authShell.classList.add('is-resuming');
  setAuthStatus('前回のログインで開いています…');
  try {
    await loadBootstrap({ resuming: true });
    setAuthStatus('');
    showAppShell();
  } catch (error) {
    authShell.classList.remove('is-resuming');
    appState.sessionToken = '';
    if (/セッションが切れています/.test(error && error.message ? error.message : String(error))) {
      forgetSession();
      setAuthStatus('ログインの有効期限が切れました。もう一度ログインしてください。');
    } else {
      showError(error, 'データの読み込み', 'auth');
    }
  }
}

function bindGlobalEvents() {
  document.getElementById('requestOtpButton').addEventListener('click', onRequestOtp);
  document.getElementById('verifyOtpButton').addEventListener('click', onVerifyOtp);
  document.getElementById('saveDraftButton').addEventListener('click', onSaveDraft);
  document.getElementById('publishButton').addEventListener('click', onPublish);
  document.getElementById('statusHistoryButton').addEventListener('click', (event) => {
    event.stopPropagation();
    toggleStatusHistory();
  });
  /* ステータスを押すと、全文が読める「履歴」を開く（ボタンを押したときは、そのボタンの動きだけにする） */
  document.getElementById('statusMessage').addEventListener('click', (event) => {
    if (event.target.closest('button')) return;
    event.stopPropagation();
    toggleStatusHistory(true);
  });
  document.getElementById('statusHistoryPanel').addEventListener('click', (event) => {
    event.stopPropagation();
  });
  document.querySelectorAll('[data-panel-target]').forEach((button) => {
    button.addEventListener('click', () => {
      activatePanel(button.getAttribute('data-panel-target'));
      /* スマホでは切り替えた先のタブを一番上から見せる */
      if (isNarrowScreen()) window.scrollTo(0, 0);
    });
  });
  bindNarrowNavAutoHide();
  bindKeyboardAwareLayout();
  document.addEventListener('click', (event) => {
    const area = document.getElementById('statusArea');
    if (area && !area.contains(event.target)) toggleStatusHistory(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') toggleStatusHistory(false);
  });
  document.addEventListener('input', (event) => {
    if (event.target.closest && event.target.closest('#appShell')) markDirty();
  });
  document.addEventListener('change', (event) => {
    if (event.target.closest && event.target.closest('#appShell')) markDirty();
  });
  window.addEventListener('beforeunload', (event) => {
    if (!appState.dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });
}

/* スマホ（UiStyles の max-width: 720px と同じ幅）では、タブをステータスの下に固定し、
   下へスクロールしている間だけ隠す。上へ少し戻すと出てくる */
const NARROW_SCREEN_QUERY = '(max-width: 720px)';
const NAV_SCROLL_THRESHOLD = 6;

function isNarrowScreen() {
  return window.matchMedia(NARROW_SCREEN_QUERY).matches;
}

function bindNarrowNavAutoHide() {
  const topbar = document.querySelector('.topbar');
  if (!topbar) return;
  /* タブを固定する位置（ボタンとステータスの高さ）。ログイン後に表示されたときや、メッセージで高さが変わったときに合わせる */
  /* 小数点以下を切り捨て、タブがステータスの下にわずかに潜るようにする（切り上げると、すき間から内容が透けて見える） */
  const updateOffset = () => document.documentElement.style.setProperty('--topbar-height', Math.floor(topbar.getBoundingClientRect().height) + 'px');
  updateOffset();
  window.addEventListener('resize', updateOffset);
  if (window.ResizeObserver) new ResizeObserver(updateOffset).observe(topbar);
  let lastY = window.scrollY;
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    const delta = y - lastY;
    if (Math.abs(delta) < NAV_SCROLL_THRESHOLD) return;
    document.body.classList.toggle('is-nav-hidden', isNarrowScreen() && delta > 0 && y > topbar.offsetHeight);
    lastY = y;
  }, { passive: true });
}

/* スマホでキーボードが開いている間は body.keyboard-open を付ける。
   見えている範囲（visualViewport）の高さと位置を CSS 変数にし、ダイアログをキーボードの上に収める。
   キーボードが閉じているときの高さを覚えておき、それより大きく縮んだら開いているとみなす */
const KEYBOARD_MIN_HEIGHT = 150;

function bindKeyboardAwareLayout() {
  const viewport = window.visualViewport;
  if (!viewport) return;
  let fullHeight = viewport.height;
  const update = () => {
    fullHeight = Math.max(fullHeight, viewport.height);
    const open = isNarrowScreen() && fullHeight - viewport.height > KEYBOARD_MIN_HEIGHT;
    const wasOpen = document.body.classList.contains('keyboard-open');
    document.body.classList.toggle('keyboard-open', open);
    document.documentElement.style.setProperty('--visible-height', Math.round(viewport.height) + 'px');
    document.documentElement.style.setProperty('--visible-top', Math.round(viewport.offsetTop) + 'px');
    /* ダイアログが縮んだあと、入力中の欄が隠れないよう見える位置まで送る */
    const active = document.activeElement;
    if (open && !wasOpen && active && active.closest && active.closest('.media-modal')) {
      setTimeout(() => active.scrollIntoView({ block: 'nearest' }), 50);
    }
  };
  viewport.addEventListener('resize', update);
  viewport.addEventListener('scroll', update);
  window.addEventListener('orientationchange', () => {
    fullHeight = 0;
    setTimeout(update, 300);
  });
  update();
}

function activatePanel(panelId) {
  document.querySelectorAll('[data-panel-target]').forEach((button) => {
    button.classList.toggle('is-active', button.getAttribute('data-panel-target') === panelId);
  });
  document.querySelectorAll('[data-panel]').forEach((panel) => {
    panel.classList.toggle('is-active', panel.getAttribute('data-panel') === panelId);
  });
  if (panelId === 'logs') {
    renderLogs();
  }
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

/* ステータスは1行に収めて作業する場所を広く残す。2行目以降や入りきらない分は「…」で省略し、
   メッセージを押すと開く「履歴」で全文を読む。入力チェックのエラー（直す項目の一覧）だけは複数行のまま出す */
function renderStatusMessage(message, kind = 'default', report = null) {
  const status = document.getElementById('statusMessage');
  status.textContent = '';
  const text = String(message == null ? '' : message);
  const lines = text.split('\n');
  const oneLine = kind !== 'error' && !report;
  appendStatusContent(status, oneLine ? lines[0] + (lines.length > 1 ? ' …' : '') : text, report);
  if (oneLine) {
    const span = status.querySelector('span');
    span.className = 'status-summary';
    span.title = text;
  }
  status.setAttribute('data-kind', kind);
  status.style.color = kind === 'error' ? '#ffd5d5' : (kind === 'success' ? '#0a0a0a' : '');
  status.style.background = kind === 'error' ? 'rgba(243,108,108,0.18)' : (kind === 'success' ? 'rgba(136,196,132,0.92)' : 'rgba(255,255,255,0.04)');
}

function statusTimeLabel(date) {
  return [
    String(date.getHours()).padStart(2, '0'),
    String(date.getMinutes()).padStart(2, '0'),
    String(date.getSeconds()).padStart(2, '0')
  ].join(':');
}

function pushStatusHistory(message, kind = 'default', report = null) {
  appState.statusHistory.unshift({
    message: String(message == null ? '' : message),
    kind,
    report,
    time: statusTimeLabel(new Date())
  });
  appState.statusHistory = appState.statusHistory.slice(0, STATUS_HISTORY_LIMIT);
  renderStatusHistory();
}

function renderStatusHistory() {
  const list = document.getElementById('statusHistoryList');
  if (!list) return;
  if (!appState.statusHistory.length) {
    list.innerHTML = '<div class="status-history-empty">まだ履歴はありません。</div>';
    return;
  }
  list.innerHTML = appState.statusHistory.map((item, index) => [
    '<div class="status-history-item is-' + escapeHtml(item.kind || 'default') + '">',
    '<div class="status-history-meta">',
    '<span>' + escapeHtml(item.time || '') + '</span>',
    '<span>' + escapeHtml(item.kind === 'error' ? 'エラー' : (item.kind === 'success' ? '完了' : '情報')) + '</span>',
    item.report ? '<button class="status-copy-button" type="button" data-history-report="' + index + '" aria-label="報告用にコピー" title="報告用にコピー">' + COPY_ICON + '</button>' : '',
    '</div>',
    '<div class="status-history-message">' + escapeHtml(item.message || '') + '</div>',
    '</div>'
  ].join('')).join('');
  list.querySelectorAll('[data-history-report]').forEach((button) => {
    const item = appState.statusHistory[Number(button.getAttribute('data-history-report'))];
    button.addEventListener('click', () => copyErrorReport(item && item.report, button));
  });
}

function toggleStatusHistory(force) {
  const panel = document.getElementById('statusHistoryPanel');
  const button = document.getElementById('statusHistoryButton');
  if (!panel || !button) return;
  const nextOpen = typeof force === 'boolean' ? force : panel.classList.contains('hidden');
  /* 履歴とエラーの詳細はどちらもステータスの下に開くので、同時には開かない */
  if (nextOpen) closeErrorReportCard('');
  panel.classList.toggle('hidden', !nextOpen);
  button.setAttribute('aria-expanded', nextOpen ? 'true' : 'false');
  if (nextOpen) renderStatusHistory();
}

function clearStatusQueue() {
  statusRuntime.queue = [];
  statusRuntime.token += 1;
  statusRuntime.processing = false;
}

async function processStatusQueue() {
  if (statusRuntime.processing) return;
  statusRuntime.processing = true;
  const token = statusRuntime.token;
  while (statusRuntime.queue.length) {
    const item = statusRuntime.queue.shift();
    renderStatusMessage(item.message, item.kind);
    await sleep(item.minMs);
    if (token !== statusRuntime.token) return;
  }
  statusRuntime.processing = false;
}

function setStatus(message, kind = 'default', options = {}) {
  if (kind === 'error' || options.immediate) {
    clearStatusQueue();
    pushStatusHistory(options.historyMessage || message, kind, options.report || null);
    renderStatusMessage(message, kind, options.report || null);
    return;
  }
  pushStatusHistory(message, kind);
  statusRuntime.queue.push({
    message,
    kind,
    minMs: options.minMs || STATUS_MIN_VISIBLE_MS
  });
  processStatusQueue();
}

function setAuthStatus(message, kind = 'default', report = null) {
  const box = document.getElementById('authStatus');
  box.textContent = '';
  appendStatusContent(box, message, report);
  box.style.color = kind === 'error' ? '#ffd5d5' : (kind === 'success' ? '#0a0a0a' : 'rgba(255,255,255,0.82)');
  box.style.background = kind === 'error' ? 'rgba(243,108,108,0.18)' : (kind === 'success' ? 'rgba(136,196,132,0.92)' : 'rgba(255,255,255,0.04)');
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* ---------- エラー表示と管理者への報告 ----------
   どの操作で何が起きたかと、利用者がまず試すことを表示する。
   システム側の問題（important）は管理者へ自動通知し、どのエラーも報告用の文面をコピーできるようにする。
   報告文にはセッショントークンなどの秘密情報を含めない。 */
const ERROR_RULES = [
  { pattern: /セッションが切れています/, important: false, hint: '一定時間操作がなかったため、ログインが切れました。ページを再読み込みして、もう一度ログインしてください。' },
  { pattern: /Excel 読み込み用ライブラリ/, important: true, hint: 'Excel の目録は今は読み込めません。Excel の「名前を付けて保存」で CSV 形式にして選び直すか、PDF・画像の目録を使ってください。' },
  { pattern: /Lock timeout|ロックのタイムアウト/i, important: false, hint: 'ほかの人の保存・公開か、直前に押した操作がまだ続いていました。1分ほど待ってから、もう一度お試しください。' },
  { pattern: /NetworkError|Failed to fetch|network/i, important: false, hint: '通信が途切れた可能性があります。インターネット接続を確認して、もう一度お試しください。' },
  { pattern: /too many times|quota|Limit Exceeded|Bandwidth/i, important: true, hint: 'Google の1日あたりの利用上限に達した可能性があります。時間をおいて（翌日に）もう一度お試しください。' },
  { pattern: /Script Properties|allowlist シート|共有設定/, important: true, hint: 'CMS の設定に問題があります。管理者に連絡してください。' },
  { pattern: /GitHub|GH_|installation token/, important: true, hint: '内容はスプレッドシートに保存済みですが、サイトへの反映を開始できませんでした。しばらくしてから、もう一度「公開」を押してください。' },
  { pattern: /Gemini API/, important: false, hint: '目録の自動読み取りが一時的に失敗しました。少し待ってもう一度お試しください。作品名・作者名は手入力もできます。' },
  { pattern: /に失敗しました|復元できません|Invalid (chunk|payload)/, important: true, hint: 'Google Drive やスプレッドシートの操作に失敗しました。少し待ってもう一度お試しください。' }
];
const UNEXPECTED_ERROR_HINT = '想定外のエラーです。もう一度お試しいただき、続く場合は管理者に連絡してください。';
const ERROR_NOTIFY_MESSAGES = {
  sending: '管理者に通知しています…',
  sent: '管理者に自動でメール通知しました。急ぎの場合は、「エラー内容をコピー」を押して直接連絡してください。',
  duplicate: '同じエラーは少し前に管理者へ通知済みです。',
  not_configured: '管理者への自動通知は設定されていません。「エラー内容をコピー」を押して、管理者に送ってください。',
  limit: '本日の自動通知の上限に達しました。「エラー内容をコピー」を押して、管理者に送ってください。',
  failed: '管理者へ自動で通知できませんでした。「エラー内容をコピー」を押して、管理者に送ってください。',
  manual: 'このエラーは管理者に自動で通知していません。解決しない場合は「エラー内容をコピー」を押して、管理者に送ってください。',
  copy_failed: '自動でコピーできませんでした。下の枠内の文章を選択してコピーし、管理者に送ってください。'
};

function errorMessageText(error) {
  const raw = error && error.message ? error.message : String(error == null ? '' : error);
  return raw.replace(/^(Exception|Error|ScriptError):\s*/, '').trim() || '不明なエラー';
}

function formatReportTime(date) {
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('/') + ' ' + statusTimeLabel(date);
}

function activePanelLabel() {
  if (typeof document === 'undefined' || typeof document.querySelector !== 'function') return '';
  const button = document.querySelector('[data-panel-target].is-active');
  /* スマホ用の短い名前ではなく、正式なタブ名を報告に使う */
  const label = button && (button.querySelector('.nav-label-full') || button);
  return label ? String(label.textContent || '').replace(/\s+/g, ' ').trim() : '';
}

function describeError(error, operation, now = new Date()) {
  const message = errorMessageText(error);
  const rule = ERROR_RULES.find((item) => item.pattern.test(message));
  const unexpected = !rule && !/[ぁ-んァ-ヶ一-龠]/.test(message);
  const report = {
    id: 'E-' + now.getTime().toString(36).toUpperCase().slice(-6) + Math.random().toString(36).slice(2, 4).toUpperCase(),
    time: formatReportTime(now),
    operation: String(operation || '操作'),
    message,
    hint: rule ? rule.hint : (unexpected ? UNEXPECTED_ERROR_HINT : ''),
    important: rule ? rule.important : unexpected,
    panel: activePanelLabel(),
    userAgent: typeof navigator !== 'undefined' ? String(navigator.userAgent || '').slice(0, 300) : ''
  };
  report.text = [
    '【凌美会 管理画面 エラー報告】',
    'エラーID: ' + report.id,
    '日時: ' + report.time,
    '操作: ' + report.operation,
    '内容: ' + report.message,
    report.panel ? '画面: ' + report.panel : '',
    report.userAgent ? 'ブラウザ: ' + report.userAgent : ''
  ].filter(Boolean).join('\n');
  return report;
}

/* エラーは3段階で見せる。
   1. 利用者が見ている場所（ステータス・画像ダイアログ・ログイン画面）のどれか1か所に、1行の要約と「詳細」
   2. 「詳細」かシステム側の問題（important）で、要約のすぐ下にエラー報告カード（対処・内容・通知状況・コピー）
   3. カード内の折りたたみに、管理者向けの報告文
   catch 節から呼ぶ。target は 'auth'（ログイン画面）か 'media'（画像設定ダイアログ）、省略時は画面上部のステータス */
function errorSummary(report) {
  return '「' + report.operation + '」ができませんでした。' + (report.hint || report.message);
}

function showError(error, operation, target = '') {
  const report = describeError(error, operation);
  report.target = target;
  const summary = errorSummary(report);
  const full = '「' + report.operation + '」ができませんでした。\n' + report.message + (report.hint ? '\n' + report.hint : '');
  if (target === 'auth') {
    setAuthStatus(summary, 'error', report);
  } else if (target === 'media') {
    pushStatusHistory(full, 'error', report);
    setMediaStatus(summary, 'error', report);
  } else {
    setStatus(summary, 'error', { report, historyMessage: full });
  }
  if (report.important) notifyErrorReport(report);
  return report;
}

/* 要約は1行に収め（はみ出す分は「…」）、全文は title で見られるようにする */
function appendStatusContent(container, message, report) {
  const text = document.createElement('span');
  text.textContent = message || '';
  container.appendChild(text);
  if (!report) return;
  text.className = 'status-summary';
  text.title = message || '';
  container.appendChild(createReportDetailButton(report));
  container.appendChild(createReportCopyButton(report));
}

function createReportDetailButton(report) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'status-detail-button';
  button.textContent = '詳細';
  button.setAttribute('aria-expanded', 'false');
  button.addEventListener('click', () => {
    const card = document.getElementById('errorReportCard');
    if (card && card.getAttribute('data-report-id') === report.id) {
      closeErrorReportCard();
      return;
    }
    openErrorReportCard(report, report.notifyState || 'manual');
  });
  return button;
}

async function notifyErrorReport(report) {
  if (!appState.sessionToken) {
    openErrorReportCard(report, 'failed');
    return;
  }
  openErrorReportCard(report, 'sending');
  try {
    const result = await serverCall('reportError', appState.sessionToken, {
      id: report.id,
      time: report.time,
      operation: report.operation,
      message: report.message,
      panel: report.panel,
      userAgent: report.userAgent
    });
    const state = result && result.notified ? (result.duplicate ? 'duplicate' : 'sent') : (result && result.reason) || 'failed';
    updateErrorReportCard(report, ERROR_NOTIFY_MESSAGES[state] ? state : 'failed');
  } catch (error) {
    console.warn('エラーの自動通知に失敗しました', error);
    updateErrorReportCard(report, 'failed');
  }
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (error) {
    /* GAS の iframe ではクリップボード API が使えないことがあるため、下の方法で再試行する */
  }
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  let copied = false;
  try {
    copied = document.execCommand('copy');
  } catch (error) {
    copied = false;
  }
  area.remove();
  return copied;
}

/* メッセージ横のコピーボタンは場所を取らないようアイコンだけにし、説明は aria-label と title で伝える */
const COPY_ICON = '<i class="fa-regular fa-copy" aria-hidden="true"></i>';
const COPIED_ICON = '<i class="fa-solid fa-check" aria-hidden="true"></i>';

async function copyErrorReport(report, button) {
  if (!report) return;
  if (!(await copyText(report.text))) {
    openErrorReportCard(report, 'copy_failed');
    return;
  }
  if (button) {
    const iconOnly = button.classList.contains('status-copy-button');
    const original = button.innerHTML;
    button.innerHTML = iconOnly ? COPIED_ICON : 'コピーしました';
    if (iconOnly) button.setAttribute('aria-label', 'コピーしました');
    button.disabled = true;
    setTimeout(() => {
      button.innerHTML = original;
      if (iconOnly) button.setAttribute('aria-label', '報告用にコピー');
      button.disabled = false;
    }, 2000);
  }
}

function createReportCopyButton(report) {

/* エラー報告カード。利用者は要約を見ているので、要約のすぐ下に開く。
   画面上部のステータスでは履歴パネルと同じく内容に重ねて開き、画像ダイアログとログイン画面では要約の下に差し込む。
   気づかないうちに消えないよう、閉じるのは「×」「閉じる」か、もう一度「詳細」を押したときだけ */
function errorReportCardPlace(report) {
  if (report.target === 'auth') return { parent: document.getElementById('authStatus'), inline: true };
  if (report.target === 'media') {
    const dialog = document.getElementById('mediaDialog');
    if (dialog && !dialog.classList.contains('hidden')) return { parent: document.getElementById('mediaDialogStatus'), inline: true };
  }

/* target を指定したときは、その場所に開いているカードだけを閉じる */
function closeErrorReportCard(target) {
  const card = document.getElementById('errorReportCard');
  if (!card) return;
  if (typeof target === 'string' && card.getAttribute('data-target') !== target) return;
  card.remove();
  document.querySelectorAll('.status-detail-button[aria-expanded="true"]').forEach((button) => button.setAttribute('aria-expanded', 'false'));
}

function openErrorReportCard(report, state) {
  closeErrorReportCard();
  const place = errorReportCardPlace(report);
  if (!place.parent) return;
  if (!place.inline) toggleStatusHistory(false);
  const card = document.createElement('section');
  card.id = 'errorReportCard';
  card.className = 'error-report-card ' + (place.inline ? 'is-inline' : 'is-dropdown');
  card.setAttribute('role', 'alert');
  card.setAttribute('data-target', report.target || '');
  if (place.inline) {
    place.parent.insertAdjacentElement('afterend', card);
  } else {
    place.parent.appendChild(card);
  }
  const detailButton = place.parent.querySelector('.status-detail-button');
  if (detailButton) detailButton.setAttribute('aria-expanded', 'true');
  card.setAttribute('data-report-id', report.id);
  card.innerHTML = [
    '<div class="error-report-head">',
    '<strong>「' + escapeHtml(report.operation) + '」ができませんでした</strong>',
    '<button class="icon-action-button" type="button" data-error-report-close aria-label="閉じる"><i class="fa-solid fa-xmark"></i></button>',
    '</div>',
    report.hint ? '<p class="error-report-hint">' + escapeHtml(report.hint) + '</p>' : '',
    '<p class="error-report-message"><span>エラーの内容</span>' + escapeHtml(report.message) + '</p>',
    '<p class="error-report-notify" data-error-report-notify></p>',
    '<details class="error-report-details"' + (state === 'copy_failed' ? ' open' : '') + '>',
    '<summary>報告用の内容を表示</summary>',
    '<textarea readonly rows="6" aria-label="報告用の内容">' + escapeHtml(report.text) + '</textarea>',
    '</details>',
    '<div class="error-report-actions">',
    '<button class="button success" type="button" data-error-report-copy>エラー内容をコピー</button>',
    '<button class="button ghost" type="button" data-error-report-close>閉じる</button>',
    '</div>'
  ].join('');
  card.querySelectorAll('[data-error-report-close]').forEach((button) => button.addEventListener('click', () => closeErrorReportCard()));
  const copyButton = card.querySelector('[data-error-report-copy]');
  copyButton.addEventListener('click', () => copyErrorReport(report, copyButton));
  updateErrorReportCard(report, state);
  if (state === 'copy_failed') card.querySelector('textarea').select();
}

function updateErrorReportCard(report, state) {
  /* コピー失敗の表示は通知状況ではないので、あとで「詳細」を開いたときには持ち越さない */
  if (state !== 'copy_failed') report.notifyState = state;

  if (!card || card.getAttribute('data-report-id') !== report.id) return;
  card.querySelector('[data-error-report-notify]').textContent = ERROR_NOTIFY_MESSAGES[state] || '';

function richTextLinkPattern() {
  const slashPair = String.fromCharCode(92, 47, 92, 47);
  return new RegExp('\\[([^\\]\\n]+)\\]\\((https?:' + slashPair + '[^\\s)]+)\\)', 'g');
}

function renderInlineRichText(value) {
  const text = String(value == null ? '' : value);
  const pattern = richTextLinkPattern();
  let html = '';
  let lastIndex = 0;
  let match;
  while ((match = pattern.exec(text)) !== null) {
    html += escapeHtml(text.slice(lastIndex, match.index));
    html += '<a href="' + escapeHtml(match[2]) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(match[1]) + '</a>';
    lastIndex = pattern.lastIndex;
  }
  html += escapeHtml(text.slice(lastIndex));
  return html;
}

function renderRichText(value) {
  const text = String(value == null ? '' : value);
  return text.split(/\r?\n/).map(renderInlineRichText).join('<br>');
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0')
  ].join('.');
}

function serverCall(functionName, ...args) {
  if (window.MOCK_BACKEND && typeof window.MOCK_BACKEND[functionName] === 'function') {
    return Promise.resolve(window.MOCK_BACKEND[functionName](...args));
  }
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((error) => reject(new Error(error && error.message ? error.message : String(error))))
      [functionName](...args);
  });
}

function sortExhibitions(items) {
  const weight = { upcoming: 0, archive: 1 };
  return (items || []).slice().sort((a, b) => {
    const bucketA = Object.prototype.hasOwnProperty.call(weight, a.displayBucket) ? weight[a.displayBucket] : 99;
    const bucketB = Object.prototype.hasOwnProperty.call(weight, b.displayBucket) ? weight[b.displayBucket] : 99;
    if (bucketA !== bucketB) return bucketA - bucketB;
    const hasDateA = !!String(a.startDate || '').trim();
    const hasDateB = !!String(b.startDate || '').trim();
    if (!hasDateA && !hasDateB) return String(b.draftCreatedAt || '').localeCompare(String(a.draftCreatedAt || ''));
    if (!hasDateA) return -1;
    if (!hasDateB) return 1;
    if (a.displayBucket === 'upcoming') return String(a.startDate || '').localeCompare(String(b.startDate || ''));
    return String(b.startDate || '').localeCompare(String(a.startDate || ''));
  });
}

function normalizeIdList(value) {
  if (typeof value === 'string') {
    try { value = JSON.parse(value); } catch (error) { value = []; }
  }
  if (!Array.isArray(value)) return [];
  const out = [];
  value.forEach((item) => {
    const text = String(item || '').trim();
    if (text && out.indexOf(text) === -1) out.push(text);
  });
  return out;
}

/* ---------- 画像の表示 ----------
   誰でも見られる画像（公開中の項目のフォルダにあるもの）は、ブラウザが Drive の URL から直接読む。
   見られない画像（非公開・下書き）は、表示したあとでサーバーに10枚ずつ頼み、データで埋める（hydrateThumbnails）。
   一度受け取った画像は thumbnailCache に覚えておく */
const THUMBNAIL_BATCH_SIZE = 10;
const thumbnailRequests = {};

function mediaImageHtml(file, attributes = '') {
  if (!file) return '';
  if (typeof file === 'string') return '<img src="' + escapeHtml(file) + '" alt=""' + attributes + '>';
  const cached = appState.thumbnailCache[file.id];
  const src = file.public === true && file.thumbnailUrl ? file.thumbnailUrl : cached;
  if (src) return '<img src="' + escapeHtml(src) + '" alt=""' + attributes + '>';
  return '<img data-thumb-id="' + escapeHtml(file.id) + '" data-thumb-folder="' + escapeHtml(file.folderId || '') + '" alt=""' + attributes + '>';
}

function applyThumbnail(fileId, dataUrl) {
  document.querySelectorAll('img[data-thumb-id]:not([src])').forEach((img) => {
    if (img.getAttribute('data-thumb-id') !== fileId) return;
    if (dataUrl) {
      img.src = dataUrl;
      return;
    }
    const note = document.createElement('span');
    note.className = 'thumb-unavailable';
    note.textContent = '画像を表示できません';
    img.replaceWith(note);
  });
}

async function hydrateThumbnails(root) {
  if (!root) return;
  const byFolder = {};
  root.querySelectorAll('img[data-thumb-id]:not([src])').forEach((img) => {
    const id = img.getAttribute('data-thumb-id');
    if (appState.thumbnailCache[id]) {
      img.src = appState.thumbnailCache[id];
      return;
    }
    if (thumbnailRequests[id]) return;
    const folderId = img.getAttribute('data-thumb-folder');
    if (!folderId) {
      applyThumbnail(id, '');
      return;
    }
    byFolder[folderId] = byFolder[folderId] || [];
    if (byFolder[folderId].indexOf(id) === -1) byFolder[folderId].push(id);
  });
  /* 同時にたくさん頼まないよう、1回ずつ順番に頼む */
  for (const folderId of Object.keys(byFolder)) {
    const ids = byFolder[folderId];
    for (let start = 0; start < ids.length; start += THUMBNAIL_BATCH_SIZE) {
      const batch = ids.slice(start, start + THUMBNAIL_BATCH_SIZE);
      batch.forEach((id) => { thumbnailRequests[id] = true; });
      let result = {};
      try {
        result = (await serverCall('getMediaThumbnails', appState.sessionToken, folderId, batch)) || {};
      } catch (error) {
        console.warn('画像を読み込めませんでした', error);
      }
      batch.forEach((id) => {
        delete thumbnailRequests[id];
        if (result[id]) appState.thumbnailCache[id] = result[id];
        applyThumbnail(id, result[id] || '');
      });
    }
  }
}

function fileById(files, id) {
  return (files || []).find((file) => file.id === id) || null;
}

function orderedFilesByIds(files, ids) {
  const imageFiles = (files || []).filter((file) => file.kind === 'image');
  const used = new Set();
  const ordered = [];
  normalizeIdList(ids).forEach((id) => {
    const found = fileById(imageFiles, id);
    if (found && !used.has(found.id)) {
      ordered.push(found);
      used.add(found.id);
    }
  });
  /* 登録した画像（ids）だけを返す。フォルダには、公開前に追加した画像や外した画像も入っているため */
  return ordered;
}

function buildThumbCarouselHtml(images, poster=false) {
  const source = (images || []).slice(0, 10);
  if (!source.length) return '';
  if (poster) {
    const first = source[0];
    const dots = source.length > 1 ? `<div class="preview-poster-dots">${source.slice(0, 2).map((_, index) => `<span class="${index === 0 ? 'is-active' : ''}"></span>`).join('')}</div>` : '';
    return `
      <div class="preview-carousel poster is-poster-carousel">
        <div class="preview-thumb">${mediaImageHtml(first)}</div>
        ${dots}
      </div>`;
  }
  const visible = source.slice(0, 4);
  const extra = Math.max(0, source.length - visible.length);
  const countClass = `count-${Math.min(source.length, 4)}`;
  return `<div class="preview-carousel ${countClass}">${visible.map((img, index) => {
    const more = (extra && index === visible.length - 1) ? `<span class="preview-more">+${extra}</span>` : '';
    return `<div class="preview-thumb">${mediaImageHtml(img)}${more}</div>`;
  }).join('')}</div>`;
}

/* 出展作品: 公開サイトと同じ行方式(行内で高さを揃え、幅は縦横比に比例)を小さめに並べる。 */
/* 縦横比は画像の読み込み後に分かるので onload で --ratio を入れる。 */
/* 確認時のスクロールを減らすため、最初の 12 点以外は「すべて表示」で開く */
const PREVIEW_WORKS_VISIBLE = 12;
function buildWorkGalleryPreviewHtml(works) {
  if (!works.length) return '';
  const cards = works.map((work) => `
    <div class="preview-work-card">
      ${mediaImageHtml(work.file, ` onload="this.parentElement.style.setProperty('--ratio', Math.min(Math.max(this.naturalWidth / this.naturalHeight, 0.4), 3).toFixed(3))"`)}
      <div class="preview-work-title">${escapeHtml(work.title || '')}</div>
      <div class="preview-work-artist">${escapeHtml(work.artist || '')}</div>
    </div>`).join('');
  const hidden = works.length - PREVIEW_WORKS_VISIBLE;
  const more = hidden > 0
    ? `<button class="preview-work-more" type="button" onclick="this.previousElementSibling.classList.remove('is-collapsed'); this.remove()">すべての作品を表示(残り${hidden}点)</button>`
    : '';
  return `
    <div class="preview-work-label">出展作品<span>${works.length}点</span></div>
    <div class="preview-work-grid${hidden > 0 ? ' is-collapsed' : ''}">${cards}</div>
    ${more}
  `;
}

/* 新歓カレンダーは全部の画像を横に並べ、スクロールして確かめる。
   枠の縦横比は、公開サイトのスマホ表示と同じく、いちばん縦長の画像に合わせる（16:9〜4:5） */
function buildRecruitPreviewHtml(images) {
  const source = (images || []).slice(0, GENERAL_IMAGE_LIMIT);
  if (!source.length) return '';
  const controls = source.length > 1 ? `
      <button class="preview-recruit-step is-prev" type="button" aria-label="前の画像" onclick="stepRecruitPreview(this, -1)">‹</button>
      <button class="preview-recruit-step is-next" type="button" aria-label="次の画像" onclick="stepRecruitPreview(this, 1)">›</button>
      <div class="preview-recruit-count">全${source.length}枚</div>` : '';
  return `
    <div class="preview-recruit-carousel">
      <div class="preview-recruit-track">${source.map((image) => `<div class="preview-recruit-slide">${mediaImageHtml(image, ' onload="fitRecruitPreviewFrame(this)"')}</div>`).join('')}</div>
      ${controls}
    </div>
  `;
}

function stepRecruitPreview(button, delta) {
  const track = button.parentElement.querySelector('.preview-recruit-track');
  if (track) track.scrollBy({ left: delta * track.clientWidth, behavior: 'smooth' });
}

function fitRecruitPreviewFrame(img) {
  const frame = img.closest('.preview-recruit-carousel');
  if (!frame || !img.naturalWidth) return;
  const ratio = Math.min(16 / 9, Math.max(0.8, img.naturalWidth / img.naturalHeight));
  const current = Number(frame.getAttribute('data-ratio') || 99);
  if (ratio >= current) return;
  frame.setAttribute('data-ratio', String(ratio));
  frame.style.aspectRatio = String(ratio);
}

function buildMetaListHtml(item) {

  if (dateTimeValue) rows.push(`<div class="preview-meta-row"><div class="preview-meta-label">会期</div><div class="preview-meta-value">${dateTimeValue}</div></div>`);
  if (venueValue) rows.push(`<div class="preview-meta-row"><div class="preview-meta-label">会場</div><div class="preview-meta-value">${venueValue}</div></div>`);

/* ブラウザで縮小してから送る。長い辺が UPLOAD_MAX_EDGE を超えるか UPLOAD_RESIZE_BYTES を超える画像だけを JPEG にする */
const UPLOAD_MAX_EDGE = 2000;
const UPLOAD_RESIZE_BYTES = 3 * 1024 * 1024;
const UPLOAD_JPEG_QUALITY = 0.85;
const CATALOG_MAX_SIZE = 10 * 1024 * 1024;
const CATALOG_MAX_IMAGES = 20;
const CATALOG_TEXT_EXTENSIONS = ['txt', 'md', 'markdown', 'csv', 'tsv', 'json'];
const CATALOG_EXCEL_EXTENSIONS = ['xlsx', 'xls'];
const CATALOG_IMAGE_TYPES = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif' };
const CATALOG_ACCEPT = [

  '.jpg', '.jpeg', '.png', '.webp', '.heic', '.heif',

const TRASH_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4h6v2"></path></svg>';
const URL_PROTOCOL = 'https:' + String.fromCharCode(47, 47);
/* cdnjs は 0.18.5 で更新が止まり既知の脆弱性が残るため、修正版を公式 CDN から読む。版を上げたら SRI も計算し直す */
const SHEETJS_URL = URL_PROTOCOL + 'cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
const SHEETJS_INTEGRITY = 'sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT';

/* onclick="...('値')" の値用。JS 文字列としてエスケープした上で、属性の " や & が崩れないよう HTML エスケープもする */
function escapeJs(value) {
  return escapeHtml(String(value == null ? '' : value)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r?\n/g, '\\n'));
}

function driveFolderUrl(folderId) {
  return URL_PROTOCOL + 'drive.google.com/drive/folders/' + encodeURIComponent(folderId || '');
}

/* 公開サイトと同じく、住所は Google が公式に案内している地図の検索 URL へのリンクにする */
function googleMapsSearchUrl(query) {
  return URL_PROTOCOL + 'www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}

/* 会期表示は開始日・終了日から作る。例: 2026年11月14日(土)〜11月18日(水)（年が変わるときは終了日にも年を付ける） */
const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

function parseIsoDate(value) {
  const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
}

function formatJapaneseDate(date, withYear) {
  return (withYear ? date.getFullYear() + '年' : '') + (date.getMonth() + 1) + '月' + date.getDate() + '日(' + WEEKDAY_LABELS[date.getDay()] + ')';
}

function formatExhibitionDateLine(startDate, endDate) {
  const start = parseIsoDate(startDate);
  if (!start) return '';
  const end = parseIsoDate(endDate);
  if (!end || end.getTime() <= start.getTime()) return formatJapaneseDate(start, true);
  return formatJapaneseDate(start, true) + '〜' + formatJapaneseDate(end, end.getFullYear() !== start.getFullYear());
}

function validateMediaSelection(files, role, context) {
  if (!files.length) throw new Error('アップロードするファイルを選択してください。');
  if (context.kind === 'exhibition' && role === 'dm') {
    const currentCount = normalizeIdList(context.item && context.item.dmFileIds).length;
    if (currentCount + files.length > 2) throw new Error('DM画像は表・裏の2枚までです。不要なDM画像を削除してから追加してください。');
  }
  const notImage = Array.from(files).find((file) => !isUploadableImage(file));
  if (notImage) throw new Error(notImage.name + ' は画像ではないため、アップロードできません。画像（JPEG・PNG・WebP・GIF・HEIC）を選んでください。');
  return true;
}

function isUploadableImage(file) {
  if (UPLOAD_IMAGE_TYPES.indexOf(String(file.type || '').toLowerCase()) !== -1) return true;
  /* パソコンでは HEIC の種類が空になることがあるので、拡張子でも確かめる */
  const ext = String(file.name || '').toLowerCase().split('.').pop();
  return !file.type && UPLOAD_IMAGE_EXTENSIONS.indexOf(ext) !== -1;
}

/* 選んだ時点で確かめ、画像以外（動画など）が混ざっていれば選択を取り消す */
function onMediaFilesChosen(input) {
  const files = Array.from(input.files || []);
  const notImage = files.find((file) => !isUploadableImage(file));
  if (!notImage) return;
  input.value = '';
  setMediaStatus(notImage.name + ' は画像ではないため選べません。画像（JPEG・PNG・WebP・GIF・HEIC）だけを選んでください。', 'error');
}

/* 大きい画像はブラウザで縮小して JPEG にする。描き直すので、写真に埋め込まれた撮影場所などの情報も消える。
   描き直せない画像（パソコンのブラウザでの HEIC など）と GIF（動きが消えるため）はそのまま送る */
async function prepareUploadPayload(file) {
  if (file.type === 'image/gif' || typeof createImageBitmap !== 'function') return readFilePayload(file);
  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch (error) {
    return readFilePayload(file);
  }
  const edge = Math.max(bitmap.width, bitmap.height);
  if (edge <= UPLOAD_MAX_EDGE && file.size <= UPLOAD_RESIZE_BYTES) {
    if (bitmap.close) bitmap.close();
    return readFilePayload(file);
  }
  const scale = Math.min(1, UPLOAD_MAX_EDGE / edge);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  const context = canvas.getContext('2d');
  /* 透明な部分は白にする（JPEG は透明を持てないため） */
  context.fillStyle = '#ffffff';
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  if (bitmap.close) bitmap.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', UPLOAD_JPEG_QUALITY));
  if (!blob) return readFilePayload(file);
  const name = String(file.name || 'image').replace(/\.[^.]+$/, '') + '.jpg';
  return readFilePayload(new File([blob], name, { type: 'image/jpeg' }));
}

function readFilePayload(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const value = String(reader.result || '');
      resolve({
        name: file.name,
        mimeType: file.type || 'application/octet-stream',
        data: value.indexOf(',') >= 0 ? value.split(',').pop() : value
      });
    };
    reader.onerror = () => reject(reader.error || new Error('ファイルの読み込みに失敗しました。'));
    reader.readAsDataURL(file);
  });
}

function catalogFileExtension(file) {
  const match = String(file && file.name || '').toLowerCase().match(/\.([a-z0-9]+)$/);
  return match ? match[1] : '';
}

function catalogFileKind(file) {
  const ext = catalogFileExtension(file);
  if (file.type === 'application/pdf' || ext === 'pdf') return 'pdf';
  if (CATALOG_IMAGE_TYPES[ext] || /^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)) return 'image';
  if (CATALOG_EXCEL_EXTENSIONS.indexOf(ext) !== -1) return 'excel';
  if (CATALOG_TEXT_EXTENSIONS.indexOf(ext) !== -1) return 'text';
  return '';
}

function validateCatalogFiles(files) {
  if (!files.length) throw new Error('目録ファイルを選択してください。');
  const kinds = files.map(catalogFileKind);
  if (kinds.indexOf('') !== -1) {
    throw new Error('対応していないファイルです。PDF・画像・Excel・テキスト（.txt / .md / .csv / .json）を選択してください。');
  }
  if (files.length > 1 && kinds.some((kind) => kind !== 'image')) {
    throw new Error('複数のファイルを選べるのは画像だけです。PDF・Excel・テキストは1つずつ読み込んでください。');
  }
  if (files.length > CATALOG_MAX_IMAGES) throw new Error('画像は' + CATALOG_MAX_IMAGES + '枚以下にしてください。');
  const total = files.reduce((sum, file) => sum + (file.size || 0), 0);
  if (total > CATALOG_MAX_SIZE) throw new Error('目録ファイルは合計10MB以下にしてください。');
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(reader.error || new Error('ファイルの読み込みに失敗しました。'));
    reader.readAsText(file);
  });
}

function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('ファイルの読み込みに失敗しました。'));
    reader.readAsArrayBuffer(file);
  });
}

/* SheetJS は Excel を読み込むときだけ読み込む。 */
let sheetJsPromise = null;
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!sheetJsPromise) {
    sheetJsPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = SHEETJS_URL;
      script.integrity = SHEETJS_INTEGRITY;
      script.crossOrigin = 'anonymous';
      script.onload = () => window.XLSX ? resolve(window.XLSX) : reject(new Error('Excel 読み込み用ライブラリを利用できません。'));
      script.onerror = () => {
        sheetJsPromise = null;
        reject(new Error('Excel 読み込み用ライブラリを取得できませんでした。'));
      };
      document.head.appendChild(script);
    });
  }
  return sheetJsPromise;
}

async function excelFileToCsvText(file) {
  const XLSX = await loadSheetJs();
  const workbook = XLSX.read(new Uint8Array(await readFileAsArrayBuffer(file)), { type: 'array' });
  const sheets = workbook.SheetNames.map((name) => {
    const csv = XLSX.utils.sheet_to_csv(workbook.Sheets[name], { blankrows: false }).trim();
    return csv ? '## シート: ' + name + '\n' + csv : '';
  }).filter(Boolean);
  if (!sheets.length) throw new Error('Excel ファイルにデータがありません。');
  return sheets.join('\n\n');
}

async function buildCatalogRequest(files) {
  const kind = catalogFileKind(files[0]);
  const name = files.length > 1 ? files[0].name + ' ほか' + (files.length - 1) + '枚' : files[0].name;
  if (kind === 'text' || kind === 'excel') {
    const text = kind === 'excel' ? await excelFileToCsvText(files[0]) : await readFileAsText(files[0]);
    if (!text.trim()) throw new Error('目録ファイルの内容が空です。');
    return { name, parts: [{ kind: 'text', name: files[0].name, text }] };
  }
  const parts = await Promise.all(files.map(async (file) => {
    const payload = await readFilePayload(file);
    return {
      kind,
      mimeType: kind === 'pdf' ? 'application/pdf' : (CATALOG_IMAGE_TYPES[catalogFileExtension(file)] || file.type),
      data: payload.data
    };
  }));
  return { name, parts };
}

function normalizeCatalogDraft(result) {
  const items = (result.items || []).map((item, index) => ({
    key: 'catalog-' + index + '-' + String(item.sortOrder || index + 1),
    sortOrder: Number(item.sortOrder) || index + 1,
    artist: String(item.artist || '').trim(),
    title: String(item.title || '').trim(),
    size: String(item.size || '').trim(),
    materials: String(item.materials || '').trim()
  })).filter((item) => item.artist || item.title);
  return {
    sourceName: result.sourceName || '',
    model: result.model || '',
    warnings: result.warnings || [],
    items
  };
}

function sortExhibitionWorksByCatalogOrder() {
  const context = currentMediaContext();
  const draft = getCatalogDraft(context);
  if (!context.item || !draft) return;
  syncMediaEditorRowsToState();
  const items = draft.items || [];
  const linkedWorks = (context.item.works || []).filter((work) => work.catalogKey);
  if (linkedWorks.length < 2) {
    setMediaStatus('作品番号順に並べるには、目録を2件以上の作品画像に紐づけてください。', 'error');
    return;
  }
  linkedWorks.sort((a, b) => {
    const itemA = items.find((item) => item.key === a.catalogKey);
    const itemB = items.find((item) => item.key === b.catalogKey);
    return Number(itemA ? itemA.sortOrder : 0) - Number(itemB ? itemB.sortOrder : 0);
  });
  const unlinkedWorks = (context.item.works || []).filter((work) => !work.catalogKey);
  context.item.works = linkedWorks.concat(unlinkedWorks);
  markDirty();
  syncActiveMediaHiddenFields();
  renderMediaDialog(context.folderId ? (appState.mediaCache[context.folderId] || []) : []);
  refreshPreviewForKind('exhibition');
  setMediaStatus('紐づけた作品を作品番号順に並べ、未紐づけ画像を後ろへ移動しました。', 'success');
}

function applyMediaResult(result, mutation) {
  const context = currentMediaContext();
  if (!context.item) return;
  const folderId = result && result.folderId ? result.folderId : '';
  const oldFolderId = context.item.mediaFolderId || '';
  context.item.mediaFolderId = folderId;
  if (oldFolderId && oldFolderId !== folderId) invalidateFolderCache(oldFolderId);
  if (folderId) {
    appState.mediaCache[folderId] = result.files || [];
    appState.imageCache[folderId] = (result.files || []).filter((file) => file.kind === 'image');
  }

  if (context.kind === 'exhibition') {
    const currentIds = new Set((result.files || []).map((file) => file.id));
    let dmFileIds = normalizeIdList(context.item.dmFileIds).filter((id) => currentIds.has(id));
    const works = (context.item.works || []).filter((work) => currentIds.has(work.fileId));
    if (mutation && mutation.type === 'upload') {
      const imageIds = (mutation.newIds || []).filter((id) => currentIds.has(id));
      if (mutation.role === 'dm') {
        dmFileIds = dmFileIds.concat(imageIds).slice(0, 2);
      } else if (mutation.role === 'work') {
        imageIds.filter((id) => !works.some((work) => work.fileId === id))
          .forEach((id) => works.push({ fileId: id, title: '', artist: '' }));
      }
    }
    context.item.dmFileIds = dmFileIds;
    context.item.works = works;
  } else {
    /* 登録は、今の登録のうち残っているものと、今回アップロードしたものだけ（フォルダの画像を全部は登録しない） */
    const currentIds = new Set((result.files || []).filter((file) => file.kind === 'image').map((file) => file.id));
    const ids = normalizeIdList(context.item.mediaFileIds).filter((id) => currentIds.has(id));
    if (mutation && mutation.type === 'upload') {
      (mutation.newIds || []).filter((id) => currentIds.has(id) && ids.indexOf(id) === -1).forEach((id) => ids.push(id));
    }
    context.item.mediaFileIds = ids;
  }

  markDirty();
  syncActiveMediaHiddenFields();
  refreshPreviewForKind(context.kind);
}

function moveMediaFile(fileId, delta) {
  const context = currentMediaContext();
  if (!context.item) return;
  const files = context.folderId ? (appState.mediaCache[context.folderId] || []) : [];
  const orderedIds = orderedFilesByIds(files, mediaIdsForItem(context.item)).map((file) => file.id);
  const index = orderedIds.indexOf(fileId);
  const next = index + delta;
  if (index < 0 || next < 0 || next >= orderedIds.length) return;
  const tmp = orderedIds[index];
  orderedIds[index] = orderedIds[next];
  orderedIds[next] = tmp;
  context.item.mediaFileIds = orderedIds;
  markDirty();
  syncActiveMediaHiddenFields();
  renderMediaDialog(files);
  refreshPreviewForKind(context.kind);
}

}

function syncActiveMediaHiddenFields() {
  const context = currentMediaContext();
  if (!context.item) return;

  const selectorMap = {
    recruit: '[data-recruit-item]',
    activity: '[data-activity-item]',
    exhibition: '[data-exhibition-item]',
    request: '[data-request-item]'
  };
  const element = document.querySelectorAll(selectorMap[context.kind] || '')[context.index];
  if (!element) return;

  const folderInput = element.querySelector('[data-field="mediaFolderId"]');
  if (folderInput) folderInput.value = context.item.mediaFolderId || '';

  if (context.kind === 'exhibition') {
    const dmInput = element.querySelector('[data-field="dmFileIds"]');
    const workInput = element.querySelector('[data-field="works"]');
    if (dmInput) dmInput.value = JSON.stringify(normalizeIdList(context.item.dmFileIds));
    if (workInput) workInput.value = JSON.stringify(context.item.works || []);
    return;
  }

  const mediaInput = element.querySelector('[data-field="mediaFileIds"]');
  if (mediaInput) mediaInput.value = JSON.stringify(normalizeIdList(context.item.mediaFileIds));
}

function formatBytes(bytes) {
  const value = Number(bytes || 0);
  if (!value) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let size = value;
  let unit = 0;
  while (size >= 1024 && unit < units.length - 1) {
    size /= 1024;
    unit += 1;
  }
  return `${size.toFixed(unit >= 3 ? 1 : 0)} ${units[unit]}`;
}

function renderStorageCard() {
  const maintenance = appState.maintenance || {};
  const storage = maintenance.storage || {};
  const recommendations = maintenance.recommendations || [];
  if (!storage.available) {
    return [
      '<div class="card storage-card is-unknown">',
      '<h3>Drive容量</h3>',
      '<div class="small-note">' + escapeHtml(storage.message || 'Drive容量を取得できませんでした。') + '</div>',
      '</div>'
    ].join('');
  }
  const pct = storage.limit ? Math.round((storage.usageRatio || 0) * 1000) / 10 : 0;
  const levelText = {
    ok: '余裕があります',
    notice: '注意',
    warning: '警告',
    danger: '強い警告'
  }[storage.level || 'ok'];
  const showRecommendations = storage.level && storage.level !== 'ok';
  const recommendationHtml = !showRecommendations
    ? ''
    : recommendations.length
    ? [
        '<div class="recommendation-list">',
        '<div class="small-note">退避候補（合計 ' + formatBytes(storage.recommendationBytes || 0) + '）</div>',
        recommendations.map((item) => [
          '<div class="recommendation-item">',
          '<div>',
          '<span class="recommendation-kind">' + escapeHtml(item.label || '') + '</span>',
          '<strong>' + escapeHtml(item.title || '') + '</strong>',

          storage.recommendationSufficient

        ) + '</div>',

      ].join('')
    : '<div class="small-note">容量を確保できる退避候補はありません。</div>';
  return [
    '<div class="card storage-card is-' + escapeHtml(storage.level || 'ok') + '">',
    '<div class="storage-head">',
    '<div data-help>',
    '<div class="help-title"><h3>Drive容量</h3>' + HELP_BUTTON + '</div>',

    '</div>',
    '<div class="storage-meter"><span style="width:' + Math.min(100, Math.max(0, pct)) + '%"></span></div>',
    '<div class="storage-row">',
    '<span>使用中 ' + formatBytes(storage.used) + ' / ' + formatBytes(storage.limit) + '</span>',
    '<strong>残り ' + formatBytes(storage.remaining) + '</strong>',
    '</div>',
    recommendationHtml,
    '</div>'
  ].join('');
}

/* 毎回は読まない説明はたたんでおき、見出し横の「？」で開く。
   data-help を付けた要素の中の .help-text が開閉の対象になる */
const HELP_BUTTON = '<button class="help-button" type="button" onclick="toggleHelp(this)" aria-expanded="false" aria-label="説明を表示" title="説明を表示"><i class="fa-regular fa-circle-question" aria-hidden="true"></i></button>';

function toggleHelp(button) {
  const box = button.closest('[data-help]');
  if (!box) return;
  const open = !box.classList.contains('is-help-open');
  box.classList.toggle('is-help-open', open);
  button.setAttribute('aria-expanded', open ? 'true' : 'false');
  button.setAttribute('aria-label', open ? '説明を閉じる' : '説明を表示');
}

function updateEditorCardTitle(input, fallback) {
  const item = input && input.closest ? input.closest('.editor-item') : null;

}

function updateRecruitYearTitle(input) {

async function loadRecruitPreview(forceRefresh = false) {
  const items = readRecruitFromDom();
  const recruit = items.find((item) => item.published !== false) || items[0] || {};
  const preview = document.getElementById('recruitPreview');

  if (!preview || !ensurePreviewOpen('recruit', preview)) return;
  const folderId = recruit.mediaFolderId || '';
  if (!folderId) {
    preview.innerHTML = '<div class="preview-empty">画像は未設定です。</div>';
    return;
  }

  const label = recruitCalendarLabel(recruit.year);
  preview.innerHTML = '<div class="preview-empty">画像を読み込んでいます…</div>';

  try {
    const files = await getFolderImagesCached(folderId, forceRefresh);
    const registered = orderedFilesByIds(files, mediaIdsForItem(recruit));
    const images = registered.slice(0, GENERAL_IMAGE_LIMIT);
    showPreviewHtml(preview, `
      <div class="preview-site">
        <article class="preview-site-card">
          <span class="preview-site-kicker">WELCOME CALENDAR</span>
          <h4>${escapeHtml(label)}</h4>
          ${buildRecruitPreviewHtml(images)}
          ${folderImageWarning(registered.length, GENERAL_IMAGE_LIMIT, '画像')}
        </article>
      </div>
    `);
  } catch (error) {
    preview.innerHTML = `<div class="preview-empty">${escapeHtml(error.message || String(error))}</div>`;
  }
}

  const nextYear = String(years.length ? Math.max.apply(null, years) + 1 : new Date().getFullYear());
  appState.state.recruitCalendars.push({

async function renderExhibitionPreview(items) {
  const visible = sortExhibitions((items || []).filter((item) => item.published !== false));
  const upcoming = visible.filter((item) => item.displayBucket === 'upcoming');
  const archive = visible.filter((item) => item.displayBucket === 'archive');
  const recent = archive.length ? archive[0] : null;
  const archiveRest = archive.slice(1);
  const sections = [];

  if (upcoming.length) {
    const upcomingCards = await Promise.all(upcoming.map(async (item, idx) => {
      const images = await getFolderImagesCached(item.mediaFolderId);
      const dm = normalizeIdList(item.dmFileIds).map((id) => fileById(images, id)).filter(Boolean);
      return buildExhibitionPreviewCardHtml(item, idx === 0 ? 'NEXT EXHIBITION' : 'UPCOMING', dm);
    }));
    sections.push(upcomingCards.join(''));
  }

  if (recent) {
    const images = await getFolderImagesCached(recent.mediaFolderId);
    const dm = normalizeIdList(recent.dmFileIds).map((id) => fileById(images, id)).filter(Boolean);
    const workImages = (recent.works || []).map((work) => {
      const found = fileById(images, work.fileId);
      return found ? { file: found, title: work.title, artist: work.artist } : null;
    }).filter(Boolean);
    sections.push(buildExhibitionPreviewCardHtml(recent, 'RECENT EXHIBITION', dm, '', buildWorkGalleryPreviewHtml(workImages)));
  }

  const archiveCards = await Promise.all(archiveRest.map(async (item) => {
    const archiveImages = await getFolderImagesCached(item.mediaFolderId);
    const archiveDm = normalizeIdList(item.dmFileIds).map((id) => fileById(archiveImages, id)).filter(Boolean);
    const folderId = item.mediaFolderId || '';
    const link = folderId
      ? `<a class="preview-drive-link" href="${escapeHtml(driveFolderUrl(folderId))}" target="_blank" rel="noopener noreferrer">Google Driveで作品を観る ↗</a>`
      : '';
    return buildExhibitionPreviewCardHtml(item, 'ARCHIVE', archiveDm, link);
  }));

  sections.push(archiveCards.length
    ? archiveCards.join('')
    : '<article class="preview-site-card"><div class="preview-empty">公開中のアーカイブはありません。</div></article>');

  return `<div class="preview-site">${sections.join('')}</div>`;
}

/* 会期表示には3つの状態がある。
   ① 自動: 日付から作った表示を読み取り専用で見せる（ペンで編集）
   ② 編集中(data-editing): 入力欄として直せる（「完了」か Enter で確定、Esc で取り消し）
   ③ 手入力(data-manual): 直した表示を読み取り専用で見せる（ペンで再編集、↺ で自動に戻す）
   日付を変えたら、どの状態でも日付から作り直して ① に戻す */
function renderDateLineField(item) {
  const auto = formatExhibitionDateLine(item.startDate, item.endDate);
  const manual = !!item.dateLine && item.dateLine !== auto;
  return [
    '<div class="date-line-field" data-date-line' + (manual ? ' data-manual' : '') + '>',
    '<input data-field="dateLine" value="' + escapeHtml(manual ? item.dateLine : auto) + '" placeholder="開始日を選ぶと自動で表示されます" aria-label="会期表示" readonly oninput="refreshExhibitionPreview()" onkeydown="onDateLineKeydown(event)">',
    '<button class="icon-action-button date-line-edit" type="button" onclick="editExhibitionDateLine(this)" aria-label="会期表示を編集" title="会期表示を編集"><i class="fa-solid fa-pen" aria-hidden="true"></i></button>',
    '<button class="button success date-line-done" type="button" onclick="finishExhibitionDateLine(this)">完了</button>',
    '<button class="icon-action-button date-line-reset" type="button" onclick="resetExhibitionDateLine(this)" aria-label="日付からの自動表示に戻す" title="日付からの自動表示に戻す"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>',
    '</div>'
  ].join('');
}

function exhibitionDateLineAuto(box) {
  const article = box.closest('[data-exhibition-item]');
  return formatExhibitionDateLine(
    article.querySelector('[data-field="startDate"]').value,
    article.querySelector('[data-field="endDate"]').value
  );
}

/* editing: 入力欄として直せる状態か。manual: 確定した表示が日付からの自動表示と違うか */
function setDateLineState(box, editing, manual) {
  box.toggleAttribute('data-editing', editing);
  box.toggleAttribute('data-manual', manual);
  box.querySelector('[data-field="dateLine"]').readOnly = !editing;
}

function editExhibitionDateLine(button) {
  const box = button.closest('[data-date-line]');
  const input = box.querySelector('[data-field="dateLine"]');
  box.setAttribute('data-previous', input.value);
  setDateLineState(box, true, box.hasAttribute('data-manual'));
  input.focus();
  input.select();
}

/* 空欄で確定したら自動の表示に戻す（会期が空のまま公開されないように） */
function finishExhibitionDateLine(button) {
  const box = button.closest('[data-date-line]');
  const input = box.querySelector('[data-field="dateLine"]');
  const auto = exhibitionDateLineAuto(box);
  input.value = input.value.trim() || auto;
  setDateLineState(box, false, input.value !== auto);
  markDirty();
  refreshExhibitionPreview();
}

function cancelExhibitionDateLine(box) {
  box.querySelector('[data-field="dateLine"]').value = box.getAttribute('data-previous') || '';
  setDateLineState(box, false, box.hasAttribute('data-manual'));
  refreshExhibitionPreview();
}

function onDateLineKeydown(event) {
  const box = event.target.closest('[data-date-line]');
  if (!box || !box.hasAttribute('data-editing')) return;
  if (event.key === 'Enter') {
    event.preventDefault();
    finishExhibitionDateLine(event.target);
  } else if (event.key === 'Escape') {
    event.preventDefault();
    cancelExhibitionDateLine(box);
  }
}

function resetExhibitionDateLine(button) {
  const box = button.closest('[data-date-line]');
  box.querySelector('[data-field="dateLine"]').value = exhibitionDateLineAuto(box);
  setDateLineState(box, false, false);
  markDirty();
  refreshExhibitionPreview();
}

function onExhibitionDateChange(input) {
  const box = input.closest('[data-exhibition-item]').querySelector('[data-date-line]');
  const wasManual = box.hasAttribute('data-manual') || box.hasAttribute('data-editing');
  box.querySelector('[data-field="dateLine"]').value = exhibitionDateLineAuto(box);
  setDateLineState(box, false, false);
  if (wasManual) setStatus('日付を変更したため、会期表示を日付から作り直しました。');
  syncExhibitionsFromDomAndRerender();
}

async function renderLogsPreviewContent() {
  const wrap = document.getElementById('logsPreviewContent');
  if (!wrap) return;
  if (!isPreviewOpen('logs')) {
    wrap.innerHTML = buildLogsPreviewCardHtml([], '', false, true);

  }
  const requestSeq = ++logsPreviewRequestSeq;
  wrap.innerHTML = buildLogsPreviewCardHtml([], '<div class="small-note" style="margin-bottom:12px;">公開後の履歴を確認しています...</div>', true);
  try {
    const data = await serverCall('previewSiteHistory', appState.sessionToken, buildPayloadFromDom());

    wrap.innerHTML = buildLogsPreviewCardHtml((data && data.compared) || []);

    wrap.innerHTML = buildLogsPreviewCardHtml([], '<div class="small-note error-text" style="margin-bottom:12px;">更新履歴プレビューを取得できませんでした: ' + escapeHtml(error.message || error) + '</div>');

function validatePayloadForSubmit(payload) {
  const messages = [];
  function contentTitle(value, fallback, index) {
    return String(value || '').trim() || fallback + ' ' + (index + 1);
  }
  function add(label, field, hint) {
    messages.push(label + '：' + field + (hint ? '（' + hint + '）' : ''));
  }

  (payload.activityArticles || []).forEach((item, index) => {
    if (!String(item.title || '').trim()) add('活動記録・告知「' + contentTitle(item.title, '新規記事', index) + '」', '記事タイトル');
  });

  (payload.exhibitions || []).forEach((item, index) => {
    const label = '展示会「' + contentTitle(item.title, '新規展示会', index) + '」';
    if (!String(item.title || '').trim()) add(label, '展示会名');
    if (item.startDate && item.endDate && item.endDate < item.startDate) add(label, '終了日', '開始日より前の日付になっています');
  });

  (payload.requestCases || []).forEach((item, index) => {
    if (!String(item.title || '').trim()) add('取り組み事例「' + contentTitle(item.title, '新規事例', index) + '」', '取り組みタイトル');
  });

  if (!messages.length) return true;
  setStatus('入力が必要な項目があります。\n- ' + messages.join('\n- '), 'error');
  return false;
}

/* 保存・公開の処理中は、もう一方も含めてボタンを押せなくする（二重に動くと、2回目がロック待ちで失敗するため） */
const SUBMIT_BUTTON_IDS = ['saveDraftButton', 'publishButton'];

async function runExclusiveSubmit(busyButtonId, busyLabel, task) {
  if (appState.submitting) return;
  appState.submitting = true;
  const busyButton = document.getElementById(busyButtonId);
  const originalLabel = busyButton ? busyButton.textContent : '';
  SUBMIT_BUTTON_IDS.forEach((id) => {
    const button = document.getElementById(id);
    if (button) button.disabled = true;
  });
  if (busyButton) busyButton.textContent = busyLabel;
  try {
    await task();
  } finally {
    appState.submitting = false;
    SUBMIT_BUTTON_IDS.forEach((id) => {
      const button = document.getElementById(id);
      if (button) button.disabled = false;
    });
    if (busyButton) busyButton.textContent = originalLabel;
  }
}

function onSaveDraft() {
  return runExclusiveSubmit('saveDraftButton', '保存中…', async () => {
    try {
      const payload = buildPayloadFromDom();
      if (!confirm('現在の内容を新しい下書きとして保存しますか？')) return;
      setStatus('下書きを保存しています…');
      const result = await serverCall('saveDraft', appState.sessionToken, payload);
      setStatus(result.message, 'success');
      await refreshMetaAfterDraftSave(payload);
      clearDirty();
    } catch (error) {
      showError(error, '下書きの保存');
    }
  });
}

function collectProofreadFields() {
  const fields = [];
  function addElement(id, label, element) {
    if (!element) return;
    fields.push({
      id,
      label,
      getText: () => element.value,
      setText: (value) => {
        element.value = value;
        element.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
  }
  function itemTitle(item, fallback) {
    const input = item.querySelector('[data-field="title"]');
    return (input && input.value.trim()) || fallback;
  }
  function eachPublished(selector, callback) {
    document.querySelectorAll(selector).forEach((item, index) => {
      if (item.getAttribute('data-published') !== 'false') callback(item, index);
    });
  }

  eachPublished('[data-exhibition-item]', (item, index) => {
    const name = '展示会「' + itemTitle(item, '新規展示会') + '」';
    addElement('exhibition:' + index + ':title', name + ' › 展示会名', item.querySelector('[data-field="title"]'));
    addElement('exhibition:' + index + ':subtitle', name + ' › サブタイトル', item.querySelector('[data-field="subtitle"]'));
    addElement('exhibition:' + index + ':theme', name + ' › テーマ', item.querySelector('[data-field="theme"]'));
  });
  eachPublished('[data-activity-item]', (item, index) => {
    const name = '活動記録・告知「' + itemTitle(item, '新規記事') + '」';
    addElement('activity:' + index + ':title', name + ' › 記事タイトル', item.querySelector('[data-field="title"]'));
    addElement('activity:' + index + ':body', name + ' › 本文', item.querySelector('[data-field="body"]'));
  });
  eachPublished('[data-request-item]', (item, index) => {
    const name = '取り組み事例「' + itemTitle(item, '新規事例') + '」';
    addElement('request:' + index + ':title', name + ' › 取り組みタイトル', item.querySelector('[data-field="title"]'));
    addElement('request:' + index + ':body', name + ' › 本文', item.querySelector('[data-field="body"]'));
  });

  const noteElement = document.getElementById('manualChangeNote');
  if (noteElement) {
    addElement('manualChangeNote', '更新履歴メモ', noteElement);
  } else {
    fields.push({
      id: 'manualChangeNote',
      label: '更新履歴メモ',
      getText: () => appState.state.manualChangeNote || '',
      setText: (value) => {
        appState.state.manualChangeNote = value;
        markDirty();
      }
    });
  }
  return fields.filter((field) => String(field.getText() || '').trim());
}

/* 公開前の誤字脱字チェック。キャンセルなら null を返す。 */
/* 続行するなら、公開成功後にチェック済みとして記録する文章（指摘のなかった文章と、利用者が「問題ない」とした文章）の配列を返す。 */
/* チェック自体が失敗した場合は公開を止めない。 */
async function runProofreadBeforePublish() {
  const fields = collectProofreadFields();
  if (!fields.length) return [];
  setStatus('誤字脱字をチェックしています…', 'default', { immediate: true });
  let result;
  try {
    result = await serverCall('proofreadForPublish', appState.sessionToken, fields.map((field) => ({
      id: field.id,
      label: field.label,
      text: field.getText()
    })));
  } catch (error) {
    setStatus('誤字脱字チェックができなかったため、チェックせずに公開します。（' + (error.message || error) + '）');
    return [];
  }

  if (result.error) {
    setStatus('誤字脱字チェックの一部ができませんでした。残り' + result.remainingCount + '項目は次回の公開時にチェックします。（' + result.error + '）');
  } else if (result.remainingCount) {
    setStatus('チェック対象が多いため、残り' + result.remainingCount + '項目は次回の公開時にチェックします。');
  }

  const fieldsById = {};
  fields.forEach((field) => { fieldsById[field.id] = field; });
  const cleanTexts = (result.cleanFieldIds || [])
    .filter((id) => fieldsById[id])
    .map((id) => fieldsById[id].getText());

  const groups = [];
  const groupById = {};
  (result.issues || []).forEach((issue) => {
    const field = fieldsById[issue.fieldId];
    if (!field) return;
    if (!groupById[field.id]) {
      groupById[field.id] = { field, issues: [] };
      groups.push(groupById[field.id]);
    }
    groupById[field.id].issues.push(issue);
  });
  if (!groups.length) return cleanTexts;

  const decision = await openProofreadDialog(groups);
  if (decision.action === 'cancel') {
    setStatus('公開をキャンセルしました。');
    return null;
  }

  const approvedTexts = [];
  groups.forEach((group) => {
    const text = decision.texts[group.field.id];
    if (typeof text === 'string' && text !== group.field.getText()) group.field.setText(text);
    if (decision.approved[group.field.id]) approvedTexts.push(group.field.getText());
  });
  return cleanTexts.concat(approvedTexts);
}

function proofreadEditorRows(field) {
  return /:body$|:theme$|^manualChangeNote$/.test(field.id) ? 8 : 2;
}

function openProofreadDialog(groups) {
  return new Promise((resolve) => {
    const issueCount = groups.reduce((sum, group) => sum + group.issues.length, 0);
    const dialog = document.createElement('div');
    dialog.className = 'media-modal proofread-modal';
    dialog.innerHTML = [
      '<div class="media-modal-backdrop"></div>',
      '<div class="media-modal-panel proofread-panel" role="dialog" aria-modal="true" aria-labelledby="proofreadDialogTitle">',
      '<div class="media-modal-head">',
      '<div>',
      '<h2 id="proofreadDialogTitle">誤字脱字の可能性があります（' + issueCount + '件）</h2>',
      '<div class="small-note">指摘を参考に、必要なら下の文章を直してください。直さなければそのまま公開します。</div>',
      '</div>',
      '<button class="icon-action-button" type="button" data-proofread-action="cancel" aria-label="閉じる"><i class="fa-solid fa-xmark"></i></button>',
      '</div>',
      '<div class="media-modal-body proofread-list">',
      groups.map((group, index) => [
        '<section class="proofread-item">',
        '<div class="small-note">' + escapeHtml(group.field.label) + '</div>',
        '<ul class="proofread-issues">',
        group.issues.map((issue) => [
          '<li>',
          '「<del>' + escapeHtml(issue.original) + '</del>」→「<ins>' + escapeHtml(issue.suggestion) + '</ins>」？',
          issue.reason ? ' <span class="proofread-reason">' + escapeHtml(issue.reason) + '</span>' : '',
          '</li>'
        ].join('')).join(''),
        '</ul>',
        '<textarea data-proofread-field="' + escapeHtml(group.field.id) + '" rows="' + proofreadEditorRows(group.field) + '" aria-label="' + escapeHtml(group.field.label) + '">' + escapeHtml(group.field.getText()) + '</textarea>',
        '<label class="proofread-approve" for="proofreadApprove' + index + '">',
        '<input type="checkbox" id="proofreadApprove' + index + '" data-proofread-approve="' + escapeHtml(group.field.id) + '">',
        '<span>この内容で問題ない（今後この文章は指摘しない）</span>',
        '</label>',
        '</section>'
      ].join('')).join(''),
      '</div>',
      '<div class="proofread-actions">',
      '<button class="button ghost" type="button" data-proofread-action="cancel">キャンセル</button>',
      '<button class="button success" type="button" data-proofread-action="publish">この内容で公開</button>',
      '</div>',
      '</div>'
    ].join('');

    function finish(action) {
      const texts = {};
      const approved = {};
      dialog.querySelectorAll('[data-proofread-field]').forEach((textarea) => {
        texts[textarea.getAttribute('data-proofread-field')] = textarea.value;
      });
      dialog.querySelectorAll('[data-proofread-approve]').forEach((input) => {
        approved[input.getAttribute('data-proofread-approve')] = input.checked;
      });
      if (action === 'cancel') {
        const edited = groups.some((group) => texts[group.field.id] !== group.field.getText());
        if (edited && !confirm('モーダル内で直した内容は破棄されます。キャンセルしますか？')) return;
      }
      dialog.remove();
      document.body.classList.remove('media-modal-open');
      resolve({ action, texts, approved });
    }
    dialog.addEventListener('click', (event) => {
      const target = event.target.closest('[data-proofread-action]');
      if (target) finish(target.getAttribute('data-proofread-action'));
    });
    document.body.appendChild(dialog);
    document.body.classList.add('media-modal-open');
  });
}

function onPublish() {
  return runExclusiveSubmit('publishButton', '公開中…', publishContent);
}

async function publishContent() {
  try {
    let payload = buildPayloadFromDom();
    if (!validatePayloadForSubmit(payload)) return;
    if (!confirm('この内容で公開しますか？')) return;
    const proofreadTexts = await runProofreadBeforePublish();
    if (!proofreadTexts) return;
    payload = buildPayloadFromDom();
    setStatus('公開処理を開始しています…');
    const result = await serverCall('publishState', appState.sessionToken, payload);
    if (proofreadTexts.length) {
      /* チェック済みの記録は公開成功後にだけ行う。失敗しても公開には影響しない。 */
      serverCall('markProofreadChecked', appState.sessionToken, proofreadTexts)
        .catch((error) => console.warn('誤字チェック済みの記録に失敗しました', error));
    }
    await loadBootstrap();
    setStatus('公開処理を完了しました。数分後にサイトに反映されます。' + (result.changeSummary ? '\n' + result.changeSummary : ''), 'success');
    clearDirty();
  } catch (error) {
    showError(error, '公開');
  }
}
function syncManualChangeNote() {
  const field = document.getElementById('manualChangeNote');
  appState.state.manualChangeNote = field ? field.value.replace(/\r\n?/g, '\n').replace(/^\n+|\n+$/g, '') : '';
}

</script>
